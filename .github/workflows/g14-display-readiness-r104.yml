name: R104 G14 Disposable Win32 Display Capability - Read Only

on:
  push:
    branches:
      - audit/g14-widescreen-mode-audit-r104
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-mode-readiness:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact experimental source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1 and PS7 parser and read-only static
        shell: pwsh
        run: |
          ./build/Probe-DisposableDisplayModes-R104.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R104 PS7 display static guard failed' }
          & powershell.exe -NoProfile -File ./build/Probe-DisposableDisplayModes-R104.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R104 PS5 display static guard failed' }
      - name: Enumerate modes and CDS_TEST only, no display mutation or product install
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
            throw 'R104 refuse untrusted Windows host'
          }
          ./build/Probe-DisposableDisplayModes-R104.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R104 readonly Win32 display capability scan failed' }
      - name: Independent raw Win32 mode receipt verification and hostile negatives
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'TBME_R104_DisplayModes/R104_DISPLAY_CAPABILITY.json'
          ./build/Verify-DisposableDisplayModes-R104.ps1 -ReceiptPath $p -ExpectedCommit $env:GITHUB_SHA -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R104 strict display receipt was rejected' }
          Write-Output 'R104_STATIC_AND_RAW_VERIFICATION_PASS_FORMAL_G14_STILL_OPEN'
      - name: Preserve raw display capability receipt even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R104-display-capability-readonly
          retention-days: 21
          if-no-files-found: warn
          path: ${{ runner.temp }}/TBME_R104_DisplayModes/R104_DISPLAY_CAPABILITY.json
