name: R94 Sanitized Unsigned In-Place Updater - Test Only

on:
  push:
    branches:
      - audit/sanitized-inplace-unsigned-r94
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized-builder:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact isolated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Static no-mutation parser guards
        shell: pwsh
        run: |
          ./build/Test-SanitizedUpgrade-V16-R94.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R94 clean v16 update script rejected' }
          ./build/Test-SanitizedUpgrade-Preview1-R94.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R94 clean Preview1 script rejected' }
      - name: Build exact unsigned Setup from sanitized source
        shell: pwsh
        run: |
          ./build/Build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R94 sanitized Setup build failed' }
          $exe='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe'
          if ((Get-FileHash $exe).Hash -cne '2DC02CDBAE39C5CF0F4677EF8035060FE00B78B883AA703FA9F83F50B9FCD05F') {
             throw 'R94 independently pinned released candidate bytes not reproducible'
          }
          if ((Get-AuthenticodeSignature $exe).Status -ne 'NotSigned') {
             throw 'R94 unsigned preview policy not honored'
          }
      - name: Independent source and binary crash-injection absence with 12 adversarial cases
        shell: pwsh
        run: |
          python -B ./build/Verify-Sanitized-Setup-R94.py --source ./installer/TaskbarMonitorEnhanced_Setup.cs --setup ./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe --output ./build/_out/Setup/R94_SANITIZED_BUILD_ATTEST.json
          if ($LASTEXITCODE -ne 0) { throw 'R94 binary still contains test or crash hooks' }
      - name: Upload exact sanitized candidate and static evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R94-unsigned-sanitized-update-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe
            build/_out/Setup/R94_SANITIZED_BUILD_ATTEST.json

  upgrade-official-v16-sanitized:
    needs: sanitized-builder
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout fresh Windows source without installed product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Refuse dirty existing installation before any input downloads
        shell: pwsh
        run: |
          $p=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          if ((Test-Path -LiteralPath $p) -or
             (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced') -or
             @(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'R94 refused non-pristine test VM without touching any installed files'
          }
      - name: Static harness preflight
        shell: pwsh
        run: |
          ./build/Test-SanitizedUpgrade-V16-R94.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R94 v16 sanitizer test parser failed' }
      - name: Download independently built exact unsigned Setup
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: R94-unsigned-sanitized-update-candidate
          path: build/_out/Setup
      - name: Verify actual candidate SHA, source hooks and 12 negative regressions
        shell: pwsh
        run: |
          $f='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe'
          if ((Get-FileHash $f).Hash -cne '2DC02CDBAE39C5CF0F4677EF8035060FE00B78B883AA703FA9F83F50B9FCD05F') { throw 'R94 candidate bytes were replaced' }
          python -B ./build/Verify-Sanitized-Setup-R94.py --source ./installer/TaskbarMonitorEnhanced_Setup.cs --setup $f --output (Join-Path $env:RUNNER_TEMP 'R94_SANITIZED_RUNTIME_ATTEST.json')
          if ($LASTEXITCODE -ne 0) { throw 'R94 runtime candidate sanitization rejected' }
      - name: Real official v16 same-root update, user fixture, edited-file refusal, hostile hooks ignored
        shell: pwsh
        run: |
          ./build/Test-SanitizedUpgrade-V16-R94.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R94 sanitized official v16 migration failed; see receipt' }
      - name: Preserve actual hosted Windows v16 update witness even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R94-sanitized-v16-upgrade-receipt
          retention-days: 21
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TBME_R94_InPlaceUpgrade/R94_INPLACE_UPGRADE_RECEIPT.json
            ${{ runner.temp }}/R94_SANITIZED_RUNTIME_ATTEST.json

  upgrade-public-preview1-sanitized:
    needs: sanitized-builder
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout another pristine disposable Windows VM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Refuse any preexisting installed product (no silent wipe)
        shell: pwsh
        run: |
          $p=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          if ((Test-Path -LiteralPath $p) -or
             (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced') -or
             @(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'R94 Preview1 requires a fresh disposable Windows VM'
          }
      - name: Static source/test no mutation
        shell: pwsh
        run: |
          ./build/Test-SanitizedUpgrade-Preview1-R94.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R94 Preview1 script did not pass parser guard' }
      - name: Download exact independently built unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: R94-unsigned-sanitized-update-candidate
          path: build/_out/Setup
      - name: Compare SHA and absence of all test-only fault hooks
        shell: pwsh
        run: |
          $f='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe'
          if ((Get-FileHash $f).Hash -cne '2DC02CDBAE39C5CF0F4677EF8035060FE00B78B883AA703FA9F83F50B9FCD05F') { throw 'R94 Setup differs from builder SHA' }
          python -B ./build/Verify-Sanitized-Setup-R94.py --source ./installer/TaskbarMonitorEnhanced_Setup.cs --setup $f --output (Join-Path $env:RUNNER_TEMP 'R94_SANITIZED_RUNTIME_ATTEST.json')
          if ($LASTEXITCODE -ne 0) { throw 'R94 sanitization not accepted on installed host' }
      - name: Actual same-version Preview1 update with data preserved and no injection callbacks
        shell: pwsh
        run: |
          ./build/Test-SanitizedUpgrade-Preview1-R94.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R94 public Preview1-to-sanitized same-root updater failed' }
      - name: Preserve raw Preview1 same-version update evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R94-sanitized-preview1-maintenance-receipt
          retention-days: 21
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TBME_R94_Preview1Maintenance/R94_PREVIEW1_MAINTENANCE_RECEIPT.json
            ${{ runner.temp }}/R94_SANITIZED_RUNTIME_ATTEST.json
