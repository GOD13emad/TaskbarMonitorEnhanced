name: Native Linux and macOS telemetry slice (experimental)

on:
  push:
    branches: [feature/r409-platform-bootstrap]
    paths:
      - 'native/**'
      - '.github/workflows/native-platform-telemetry.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-platform-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build platform-native C++17 probe
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic native/telemetry/main.cpp -o tbme-native-probe
      - name: Install GTK3 and Xvfb only on disposable Ubuntu CI host
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb xdotool dbus-x11

      - name: Compile native GTK3 Linux desktop window and sensor smoke test
        if: runner.os == 'Linux'
        run: |
          set -eu
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            native/linux/Panel.cpp -o tbme-linux-panel $(pkg-config --cflags --libs gtk+-3.0)
          ./tbme-linux-panel --self-test | grep -Fx 'TBME_LINUX_GTK3_NATIVE_SENSOR_SELFTEST=PASS'
          if ./tbme-linux-panel --unsupported >/dev/null 2>&1; then exit 1; fi
          dbus-run-session -- xvfb-run -a bash -eu -c '
            ./tbme-linux-panel >/dev/null 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 3
            xdotool search --name "TaskbarMonitorEnhanced Native Linux" >/dev/null
          '
          echo 'TBME_LINUX_GTK3_XVFB_WINDOW_SMOKE=PASS'

      - name: Compile native AppKit macOS status menu and sensor smoke test
        if: runner.os == 'macOS'
        run: |
          set -eu
          clang++ -std=c++17 -O2 -fobjc-arc -Wall -Wextra -Werror -pedantic \
            native/macos/StatusBar.mm -framework AppKit -framework Foundation -o tbme-macos-status
          ./tbme-macos-status --self-test | grep -Fx 'TBME_MACOS_APPKIT_NATIVE_SENSOR_SELFTEST=PASS'
          if ./tbme-macos-status --unsupported >/dev/null 2>&1; then exit 1; fi
          echo 'TBME_MACOS_APPKIT_BINARY_BUILD=PASS_NO_INTERACTIVE_GUI_ASSERTION'
      - name: Native self-test and JSON contract
        run: |
          set -eu
          ./tbme-native-probe --self-test | grep -Fx 'TBME_NATIVE_SENSOR_SELFTEST=PASS'
          ./tbme-native-probe --once > telemetry.json
          python3 - <<'PY'
          import json
          import math
          import platform
          with open("telemetry.json", encoding="utf-8") as f:
              data = json.load(f)
          expected = "macos" if platform.system() == "Darwin" else "linux"
          assert data["schema"] == 1 and data["platform"] == expected
          assert type(data["cpuPercent"]) is float
          assert math.isfinite(data["cpuPercent"]) and 0 <= data["cpuPercent"] <= 100
          assert type(data["memoryTotalBytes"]) is int and data["memoryTotalBytes"] > 0
          assert type(data["memoryAvailableBytes"]) is int
          assert 0 <= data["memoryAvailableBytes"] <= data["memoryTotalBytes"]
          assert data["cpuTemperatureC"] is None and data["temperatureAvailable"] is False
          print("TBME_NATIVE_PLATFORM_JSON=PASS", expected)
          PY
          if ./tbme-native-probe --wrong >/dev/null 2>&1; then
            echo 'unsupported arguments accepted'; exit 1
          fi
          echo 'TBME_NATIVE_PLATFORM_ARGUMENT_REFUSAL=PASS'
          ./tbme-native-probe --samples 3 > telemetry-stream.ndjson
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("telemetry-stream.ndjson").read_text(encoding="utf-8").splitlines()
          assert len(lines) == 3, f"expected 3 streaming samples, got {len(lines)}"
          for line in lines:
              record = json.loads(line)
              assert record["schema"] == 1
              assert 0 <= record["cpuPercent"] <= 100
              assert 0 <= record["memoryAvailableBytes"] <= record["memoryTotalBytes"]
              assert record["temperatureAvailable"] is False
              assert record["cpuTemperatureC"] is None
          print("TBME_NATIVE_FINITE_STREAM=PASS samples=3")
          PY
          for count in 0 61 -1 3x; do
            if ./tbme-native-probe --samples "$count" > rejected-output.txt 2>/dev/null; then
              echo "unsupported stream count accepted: $count"; exit 1
            fi
            if test -s rejected-output.txt; then
              echo "invalid stream count emitted telemetry: $count"; exit 1
            fi
          done
          echo 'TBME_NATIVE_STREAM_COUNT_REFUSAL=PASS'
