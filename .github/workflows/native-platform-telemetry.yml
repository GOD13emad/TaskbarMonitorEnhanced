name: Native Linux and macOS telemetry slice (experimental)

on:
  push:
    branches: [feature/r409-platform-bootstrap]
    paths:
      - 'native/**'
      - '.github/workflows/native-platform-telemetry.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-platform-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build platform-native C++17 probe
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic native/telemetry/main.cpp -o tbme-native-probe
      - name: Install GTK3 and Xvfb only on disposable Ubuntu CI host
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev xvfb xdotool dbus-x11

      - name: Compile native GTK3 Linux desktop window and sensor smoke test
        if: runner.os == 'Linux'
        run: |
          set -eu
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            native/linux/Panel.cpp -o tbme-linux-panel $(pkg-config --cflags --libs gtk+-3.0)
          ./tbme-linux-panel --self-test | grep -Fx 'TBME_LINUX_GTK3_NATIVE_SENSOR_SELFTEST=PASS'
          if ./tbme-linux-panel --unsupported >/dev/null 2>&1; then exit 1; fi
          dbus-run-session -- xvfb-run -a bash -eu -c '
            ./tbme-linux-panel >/dev/null 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 3
            xdotool search --name "TaskbarMonitorEnhanced Native Linux" >/dev/null
          '
          echo 'TBME_LINUX_GTK3_XVFB_WINDOW_SMOKE=PASS'

      - name: Compile native AppKit macOS status menu and sensor smoke test
        if: runner.os == 'macOS'
        run: |
          set -eu
          clang++ -std=c++17 -O2 -fobjc-arc -Wall -Wextra -Werror -pedantic \
            native/macos/StatusBar.mm -framework AppKit -framework Foundation -o tbme-macos-status
          ./tbme-macos-status --self-test | grep -Fx 'TBME_MACOS_APPKIT_NATIVE_SENSOR_SELFTEST=PASS'
          if ./tbme-macos-status --unsupported >/dev/null 2>&1; then exit 1; fi
          echo 'TBME_MACOS_APPKIT_BINARY_BUILD=PASS_NO_INTERACTIVE_GUI_ASSERTION'
      - name: Build and inspect unsigned Linux Debian preview, without installing
        if: runner.os == 'Linux'
        run: |
          set -eu
          deb="$RUNNER_TEMP/taskbarmonitorenhanced-native-preview.deb"
          bash native/linux/build-preview-deb.sh "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = 'taskbarmonitorenhanced-native-preview'
          before="$(sha256sum "$deb" | cut -d' ' -f1)"
          if bash native/linux/build-preview-deb.sh "$deb" >/dev/null 2>&1; then
            echo 'overwrite of existing preview incorrectly permitted'; exit 1
          fi
          after="$(sha256sum "$deb" | cut -d' ' -f1)"
          test "$before" = "$after"
          echo 'TBME_LINUX_PACKAGE_NO_OVERWRITE=PASS'

      - name: Install and purge owned preview package on disposable Ubuntu CI only
        if: runner.os == 'Linux'
        run: |
          set -eu
          package='taskbarmonitorenhanced-native-preview'
          deb="$RUNNER_TEMP/taskbarmonitorenhanced-native-preview.deb"
          if dpkg-query -s "$package" 2>/dev/null | grep -q '^Status: install ok installed$'; then
            echo 'R445 refused a pre-existing native package on the runner'; exit 1
          fi
          # Ephemeral GitHub-hosted runner has explicit noninteractive sudo.
          # The owner Ubuntu/Windows machines are never modified by this test.
          trap 'sudo -n dpkg --purge taskbarmonitorenhanced-native-preview >/dev/null 2>&1 || true' EXIT
          sudo -n dpkg -i "$deb"
          test -x /usr/bin/tbme-linux-panel
          test -f /usr/share/applications/tbme-native-preview.desktop
          /usr/bin/tbme-linux-panel --self-test |
            grep -Fx 'TBME_LINUX_GTK3_NATIVE_SENSOR_SELFTEST=PASS'
          dpkg-query -s "$package" | grep -Fx 'Status: install ok installed'
          sudo -n dpkg --purge "$package"
          test ! -e /usr/bin/tbme-linux-panel
          test ! -e /usr/share/applications/tbme-native-preview.desktop
          if dpkg-query -s "$package" 2>/dev/null | grep -q '^Status: install ok installed$'; then
            echo 'R445 native package remained installed after purge'; exit 1
          fi
          trap - EXIT
          echo 'TBME_R445_DISPOSABLE_REAL_DPKG_INSTALL_AND_PURGE=PASS'
      - name: Build and inspect unsigned macOS agent app bundle, without installing
        if: runner.os == 'macOS'
        run: |
          set -eu
          app="$RUNNER_TEMP/TaskbarMonitorEnhancedNativePreview.app"
          bash native/macos/build-preview-app.sh "$app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/tbme-macos-status"
          before="$(shasum -a 256 "$app/Contents/MacOS/tbme-macos-status" | cut -d' ' -f1)"
          if bash native/macos/build-preview-app.sh "$app" >/dev/null 2>&1; then
            echo 'overwrite of existing app incorrectly permitted'; exit 1
          fi
          after="$(shasum -a 256 "$app/Contents/MacOS/tbme-macos-status" | cut -d' ' -f1)"
          test "$before" = "$after"
          echo 'TBME_MACOS_PACKAGE_NO_OVERWRITE=PASS'
      - name: Preserve unsigned Linux preview as temporary internal CI artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TBME-R444-Linux-Native-LAB-NOT-RELEASE
          path: ${{ runner.temp }}/taskbarmonitorenhanced-native-preview.deb
          if-no-files-found: error
          retention-days: 2

      - name: Package unsigned macOS app preserving permissions
        if: runner.os == 'macOS'
        run: |
          set -eu
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/TaskbarMonitorEnhancedNativePreview.app" "$RUNNER_TEMP/TBME-R444-macOS-preview.zip"
          test -s "$RUNNER_TEMP/TBME-R444-macOS-preview.zip"

      - name: Preserve unsigned macOS app as temporary internal CI artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TBME-R444-macOS-Native-LAB-NOT-RELEASE
          path: ${{ runner.temp }}/TBME-R444-macOS-preview.zip
          if-no-files-found: error
          retention-days: 2
      - name: Native self-test and JSON contract
        run: |
          set -eu
          ./tbme-native-probe --self-test | grep -Fx 'TBME_NATIVE_SENSOR_SELFTEST=PASS'
          ./tbme-native-probe --once > telemetry.json
          python3 - <<'PY'
          import json
          import math
          import platform
          with open("telemetry.json", encoding="utf-8") as f:
              data = json.load(f)
          expected = "macos" if platform.system() == "Darwin" else "linux"
          assert data["schema"] == 1 and data["platform"] == expected
          assert type(data["cpuPercent"]) is float
          assert math.isfinite(data["cpuPercent"]) and 0 <= data["cpuPercent"] <= 100
          assert type(data["memoryTotalBytes"]) is int and data["memoryTotalBytes"] > 0
          assert type(data["memoryAvailableBytes"]) is int
          assert 0 <= data["memoryAvailableBytes"] <= data["memoryTotalBytes"]
          assert data["cpuTemperatureC"] is None and data["temperatureAvailable"] is False
          print("TBME_NATIVE_PLATFORM_JSON=PASS", expected)
          PY
          if ./tbme-native-probe --wrong >/dev/null 2>&1; then
            echo 'unsupported arguments accepted'; exit 1
          fi
          echo 'TBME_NATIVE_PLATFORM_ARGUMENT_REFUSAL=PASS'
          ./tbme-native-probe --samples 3 > telemetry-stream.ndjson
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("telemetry-stream.ndjson").read_text(encoding="utf-8").splitlines()
          assert len(lines) == 3, f"expected 3 streaming samples, got {len(lines)}"
          for line in lines:
              record = json.loads(line)
              assert record["schema"] == 1
              assert 0 <= record["cpuPercent"] <= 100
              assert 0 <= record["memoryAvailableBytes"] <= record["memoryTotalBytes"]
              assert record["temperatureAvailable"] is False
              assert record["cpuTemperatureC"] is None
          print("TBME_NATIVE_FINITE_STREAM=PASS samples=3")
          PY
          for count in 0 61 -1 3x; do
            if ./tbme-native-probe --samples "$count" > rejected-output.txt 2>/dev/null; then
              echo "unsupported stream count accepted: $count"; exit 1
            fi
            if test -s rejected-output.txt; then
              echo "invalid stream count emitted telemetry: $count"; exit 1
            fi
          done
          echo 'TBME_NATIVE_STREAM_COUNT_REFUSAL=PASS'
          # A longer native sequence can reveal macOS 32-bit Mach counter wraps.
          ./tbme-native-probe --samples 20 > telemetry-stress.ndjson
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("telemetry-stress.ndjson").read_text(encoding="utf-8").splitlines()
          assert len(lines) == 20, f"expected 20 records, got {len(lines)}"
          for line in lines:
              data = json.loads(line)
              assert 0 <= data["cpuPercent"] <= 100
              assert 0 <= data["memoryAvailableBytes"] <= data["memoryTotalBytes"]
          print("TBME_NATIVE_TWENTY_CONSECUTIVE_SAMPLES=PASS")
          PY
