name: R198 - Hosted Full-App CPU A/B Guarded
on:
  push:
    branches:
      - audit/r193-hosted-full-app-cpu
permissions:
  contents: read

jobs:
  full-app-cpu-ab:
    runs-on: windows-latest
    timeout-minutes: 22
    name: Disposable Windows actual whole-program CPU A/B (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [A, B]
    steps:
      - name: Exact test-only source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact ancestor and Git-normalized SHA (R193/R194 failure prevention)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # R193-F01 shallow checkout: fetch-depth 0, verify ancestry by SHA not HEAD^.
          # R194-F01 CRLF conversion: normalize working-tree text before SHA.
          $baseline='1b2bf5b6b58313706556d10efd242270583b5f0d'
          & git cat-file -e ($baseline+'^{commit}')
          if($LASTEXITCODE -ne 0){throw 'R195_BASELINE_ANCESTOR_NOT_FETCHED'}
          & git merge-base --is-ancestor $baseline HEAD
          if($LASTEXITCODE -ne 0){throw 'R195_TRIAL_BASE_NOT_ANCESTOR'}
          $changed=@(& git diff --name-only $baseline HEAD | Sort-Object)
          if(($changed -join '|') -cne '.github/workflows/audit-cpu-r193.yml|build/Test-HostedCpu-R193.ps1'){
             throw 'R195_CHANGED_FILES_NOT_EXACT_TWO_TEST_SOURCES'
          }
          $productChanges=@(& git diff --name-only $baseline HEAD -- src)
          if($productChanges.Count -ne 0){throw 'R195_PRODUCT_SOURCE_MUTATED'}
          $script=(Resolve-Path 'build/Test-HostedCpu-R193.ps1').Path
          $raw=[IO.File]::ReadAllText($script,[Text.Encoding]::UTF8)
          $lf=$raw.Replace(([string][char]13+[string][char]10),([string][char]10)).Replace(([string][char]13),([string][char]10))
          $bytes=[Text.Encoding]::UTF8.GetBytes($lf)
          $hash=[Security.Cryptography.SHA256]::Create()
          try{$actual=[Convert]::ToHexString($hash.ComputeHash($bytes))}finally{$hash.Dispose()}
          if($actual -cne 'F36EA073D48905A7DD4AAFB02404D559BD6F75E64CC1652DDEEC4B71BECBB784'){
             throw 'R195_CANONICAL_LF_TEST_HARNESS_SHA_NOT_PINNED'
          }
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){throw 'R195_TEST_HARNESS_PARSER_FAIL'}
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced'){
             throw 'R195_REFUSE_NON_DISPOSABLE_HOST'
          }
          'R195_STRICT_GIT_ANCESTRY_AND_CANONICAL_BYTE_PREFLIGHT=PASS'

      - name: Confirm exact fresh disposable identity BEFORE build (R197 proven)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced'){
            throw 'R198_REFUSE_NON_DISPOSABLE_HOST'
          }
          $out=Join-Path $env:RUNNER_TEMP 'TBME_R193_CPU_${{ matrix.host }}'
          $app=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          $unreg='HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced'
          $f=Join-Path $env:RUNNER_TEMP 'R198_BEFORE_BUILD_${{ matrix.host }}.json'
          if(Test-Path $f){throw 'R198_ALREADY_EXAMINED_DISPOSABLE_VM'}
          $row=[ordered]@{
            Revision='R198';Host='${{ matrix.host }}';GitCommit=$env:GITHUB_SHA;
            OutputRootExisted=[bool](Test-Path $out);
            AppDataRootExisted=[bool](Test-Path $app);
            UninstallKeyExisted=[bool](Test-Path $unreg);
            MatchingAppProcessCount=[int]@(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count;
            NoPersonalMachineTouched=$true;
          }
          [IO.File]::WriteAllText($f,($row|ConvertTo-Json -Depth 4),[Text.UTF8Encoding]::new($false))
          if($row.OutputRootExisted -or $row.AppDataRootExisted -or
             $row.UninstallKeyExisted -or $row.MatchingAppProcessCount -ne 0){
            throw 'R198_INITIAL_DISPOSABLE_STATE_NOT_FRESH'
          }
          'R198_FRESH_PRIOR_TO_BUILD=PASS'

      - name: Build unchanged R190 candidate with deterministic SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Build.ps1
          $main='./build/_out/App/TaskbarMonitorEnhanced.exe'
          if((Get-FileHash $main -Algorithm SHA256).Hash -cne '3448552CA6711D861BAD3739BEA77FC04626477DF64D5E30227BC95AF00771AF'){throw 'R193_CANDIDATE_BINARY_NOT_EXACT_R190'}
          'R193_CANDIDATE_SAME_BINARY_AS_R190=PASS'

      - name: Real full-application ABBA four sustained 60-second blocks
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-HostedCpu-R193.ps1 -HostLabel '${{ matrix.host }}'
          $receipt=Join-Path $env:RUNNER_TEMP 'TBME_R193_CPU_${{ matrix.host }}/R193_CPU_AB.json'
          if(!(Test-Path $receipt -PathType Leaf)){throw 'R193_CPU_RECEIPT_MISSING'}
          $r=Get-Content $receipt -Raw|ConvertFrom-Json
          if($r.Status -cne 'PASS_4_SUSTAINED_FULL_APP_BLOCKS_TWO_VERSIONS_SAME_HOST' -or
             @($r.ActualBlocks).Count -ne 4 -or !$r.AllBlocksCompleted -or
             !$r.RestoredBaselineExeOnSacrificialHost -or
             $r.OwnerPersonalComputerTouched -ne $false){throw 'R193_FULL_PROGRAM_CPU_AB_NOT_ACCEPTED'}
          'R193_HOSTED_FULL_PROGRAM_CPU_AB_DONE'

      - name: Keep sanitized CPU measurement receipt on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R198-fullapp-cpu-${{ matrix.host }}
          if-no-files-found: warn
          retention-days: 21
          path: |
            ${{ runner.temp }}/TBME_R193_CPU_${{ matrix.host }}/R193_CPU_AB.json
            ${{ runner.temp }}/R198_BEFORE_BUILD_${{ matrix.host }}.json
