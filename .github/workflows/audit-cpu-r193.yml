name: R201 - Separated-Build Fresh-Windows Full-App CPU A/B
on:
  push:
    branches:
      - audit/r193-hosted-full-app-cpu
permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    name: Deterministic compiled candidate on separate build Windows
    steps:
      - name: Full-history exact checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify only test files since accepted product patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced'){
            throw 'R201_REFUSE_NON_DISPOSABLE_WINDOWS'
          }
          $base='1b2bf5b6b58313706556d10efd242270583b5f0d'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){throw 'R201_BASE_PRODUCT_SHA_NOT_ANCESTOR'}
          $product=@(git diff --name-only $base HEAD -- src)
          if($product.Count -ne 0){throw 'R201_PRODUCT_SOURCE_MODIFIED'}
          $test=Resolve-Path 'build/Test-HostedCpu-R201.ps1'
          $code=[IO.File]::ReadAllText($test.Path,[Text.Encoding]::UTF8)
          $lf=$code.Replace(([string][char]13+[string][char]10),([string][char]10)).Replace(([string][char]13),([string][char]10))
          $hash=[Security.Cryptography.SHA256]::Create()
          try{$actual=[Convert]::ToHexString($hash.ComputeHash([Text.Encoding]::UTF8.GetBytes($lf)))}finally{$hash.Dispose()}
          if($actual -cne 'FC11672E4647E6F237281E626AA2BF3CD05597CC0EDE7CBADA6F8B7032D8EDCE'){throw 'R201_TEST_SCRIPT_CANONICAL_HASH_DRIFT'}
          'R201_ONLY_TEST_FILES_SOURCE=PASS'
      - name: Exact R190 Build and deterministic output SHA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Build.ps1
          $exe=Resolve-Path 'build/_out/App/TaskbarMonitorEnhanced.exe'
          if((Get-FileHash $exe -Algorithm SHA256).Hash -cne '3448552CA6711D861BAD3739BEA77FC04626477DF64D5E30227BC95AF00771AF'){throw 'R201_COMPILED_MAIN_DIFFERS_FROM_R190'}
          $dest=Join-Path $env:RUNNER_TEMP 'R201_ONLY_COMPILED_CANDIDATE'
          if(Test-Path $dest){throw 'R201_BUILD_ARTIFACT_PREEXISTING'}
          New-Item -Path $dest -ItemType Directory -ErrorAction Stop|Out-Null
          Copy-Item -LiteralPath $exe.Path -Destination (Join-Path $dest 'TaskbarMonitorEnhanced.exe') -ErrorAction Stop
          if((Get-FileHash (Join-Path $dest 'TaskbarMonitorEnhanced.exe') -Algorithm SHA256).Hash -cne '3448552CA6711D861BAD3739BEA77FC04626477DF64D5E30227BC95AF00771AF'){throw 'R201_ARTIFACT_TRANSFER_SHA'}
          'R201_SEPARATE_BUILD_BINARY_ACCEPTED=PASS'
      - name: Store only SHA-pinned Main executable for fresh CPU Windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R201-only-candidate-main
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/R201_ONLY_COMPILED_CANDIDATE/TaskbarMonitorEnhanced.exe

  full-app-cpu-ab:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 26
    name: Pristine independent CPU host ${{ matrix.host }} - official 171 to 172 then 4x60 sec ABBA
    strategy:
      fail-fast: false
      matrix:
        host: [A, B]
    steps:
      - name: Exact source checkout, no Build execution on this CPU host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Import Main from independent Build job without executing Build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R201-only-candidate-main
          path: ${{ runner.temp }}/TBME_R201_CANDIDATE
      - name: Prove exact SHA and truly fresh per-user install root BEFORE Setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced'){
            throw 'R201_REFUSE_NON_DISPOSABLE_WINDOWS'
          }
          $exe=Join-Path $env:RUNNER_TEMP 'TBME_R201_CANDIDATE/TaskbarMonitorEnhanced.exe'
          if((Get-FileHash $exe -Algorithm SHA256).Hash -cne '3448552CA6711D861BAD3739BEA77FC04626477DF64D5E30227BC95AF00771AF'){throw 'R201_DOWNLOADED_CANDIDATE_SHA_MISMATCH'}
          $base='1b2bf5b6b58313706556d10efd242270583b5f0d'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){throw 'R201_CPU_JOB_BASE_NOT_ANCESTOR'}
          if(@(git diff --name-only $base HEAD -- src).Count){throw 'R201_CPU_JOB_PRODUCT_SOURCE_CHANGED'}
          $app=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          $out=Join-Path $env:RUNNER_TEMP 'TBME_R193_CPU_${{ matrix.host }}'
          $reg='HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced'
          $proof=Join-Path $env:RUNNER_TEMP 'R201_PREINSTALL_${{ matrix.host }}.json'
          if(Test-Path $proof){throw 'R201_PREVIOUS_CPU_PRESTATE_PROOF_EXISTS'}
          $state=[ordered]@{
            Revision='R201';Host='${{ matrix.host }}';GitCommit=$env:GITHUB_SHA
            OutputExists=[bool](Test-Path $out);AppRootExists=[bool](Test-Path $app)
            UninstallKeyExists=[bool](Test-Path $reg)
            ProcessCount=[int]@(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count
            DownloadedBinarySHA256=(Get-FileHash $exe -Algorithm SHA256).Hash
            NoBuildExecutedInCpuJob=$true;NoPersonalMachineTouched=$true
          }
          [IO.File]::WriteAllText($proof,($state|ConvertTo-Json -Depth 4),[Text.UTF8Encoding]::new($false))
          if($state.OutputExists -or $state.AppRootExists -or $state.UninstallKeyExists -or $state.ProcessCount -ne 0){
             throw 'R201_VM_NOT_FRESH_BEFORE_OFFICIAL_INSTALL'
          }
          'R201_CPU_VM_CLEAN_BEFORE_SETUP=PASS'
      - name: Official 171 fresh install to 172 upgrade and real ABBA 4x60 sec
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-HostedCpu-R201.ps1 -HostLabel '${{ matrix.host }}'
          $receipt=Join-Path $env:RUNNER_TEMP 'TBME_R193_CPU_${{ matrix.host }}/R201_CPU_AB.json'
          if(!(Test-Path -LiteralPath $receipt -PathType Leaf)){throw 'R201_REAL_CPU_RECEIPT_MISSING'}
          $v=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
          if($v.Revision -cne 'R201' -or $v.Status -cne 'PASS_4_SUSTAINED_FULL_APP_BLOCKS_TWO_VERSIONS_SAME_HOST' -or
             $v.Host -cne '${{ matrix.host }}' -or !$v.AllBlocksCompleted -or
             !$v.Fresh171ThenUpgraded172InPlace -or !$v.RestoredBaselineExeOnSacrificialHost -or
             @($v.ActualBlocks).Count -ne 4 -or $v.OwnerPersonalComputerTouched -ne $false){
             throw 'R201_REAL_4X60SEC_CPU_ABBA_NOT_ACCEPTED'
          }
          'R201_HOSTED_REAL_ABBA_STATUS=PASS'
      - name: Preserve only sanitized CPU and origin receipts even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R201-fullapp-cpu-${{ matrix.host }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TBME_R193_CPU_${{ matrix.host }}/R201_CPU_AB.json
            ${{ runner.temp }}/R201_PREINSTALL_${{ matrix.host }}.json
