name: R197 - Disposable CPU Prestate Diagnosis
on:
  push:
    branches:
      - audit/r193-hosted-full-app-cpu
permissions:
  contents: read
jobs:
  prestate-only:
    runs-on: windows-latest
    timeout-minutes: 17
    name: Read-only R195 prestate diagnosis - ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [A, B]
    steps:
      - name: Checkout exact test-only branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify four R195 guards BEFORE and AFTER Build; no install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced'){throw 'R197_DISPOSABLE_HOST_IDENTITY'}
          $base='1b2bf5b6b58313706556d10efd242270583b5f0d'
          & git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){throw 'R197_NOT_EXACT_ANCESTRY'}
          if(@(& git diff --name-only $base HEAD -- src).Count){throw 'R197_PRODUCT_SOURCE_CHANGED'}
          $out=Join-Path $env:RUNNER_TEMP 'TBME_R193_CPU_${{ matrix.host }}'
          $app=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          $unreg='HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced'
          $snapshot={
            return [ordered]@{
              R195OutputFolderExists=[bool](Test-Path $out)
              R195AppRootExists=[bool](Test-Path $app)
              R195CurrentUserUninstallKeyExists=[bool](Test-Path $unreg)
              R195AppProcessCount=[int]@(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count
            }
          }
          $before=(& $snapshot)
          $dir=Join-Path $env:RUNNER_TEMP 'R197_PRESTATE_${{ matrix.host }}'
          if(Test-Path $dir){throw 'R197_NOT_FRESH_DIAGNOSTIC_DIRECTORY'}
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop|Out-Null
          $buildStatus='UNPROVEN'
          try {
            ./build/Build.ps1
            $candidate='./build/_out/App/TaskbarMonitorEnhanced.exe'
            if((Get-FileHash $candidate -Algorithm SHA256).Hash -cne '3448552CA6711D861BAD3739BEA77FC04626477DF64D5E30227BC95AF00771AF'){throw 'R197_EXACT_R190_BINARY_SHA_MISMATCH'}
            $buildStatus='PASS_EXACT_R190_BINARY'
          }catch{$buildStatus='FAIL_NO_CPU_MEASUREMENT_'+$_.Exception.GetType().Name}
          $after=(& $snapshot)
          $flags=@()
          if($after.R195OutputFolderExists){$flags+=@('OUTPUT_FOLDER')}
          if($after.R195AppRootExists){$flags+=@('APP_DATA_ROOT')}
          if($after.R195CurrentUserUninstallKeyExists){$flags+=@('HKCU_UNINSTALL')}
          if($after.R195AppProcessCount -gt 0){$flags+=@('APP_PROCESS')}
          $receipt=[ordered]@{
            Revision='R197'; Host='${{ matrix.host }}'; Commit=$env:GITHUB_SHA;
            BeforeBuild=$before; AfterBuild=$after; BuildStatus=$buildStatus;
            TriggeredAfterBuild=@($flags);
            AppRootNewlyCreated=(!$before.R195AppRootExists -and $after.R195AppRootExists);
            LogsDirectoryPresent=[bool](Test-Path (Join-Path $app 'Logs'));
            ConfigFilePresent=[bool](Test-Path (Join-Path $app 'config.json'));
            RunnerImageOS=$env:ImageOS;RunnerImageVersion=$env:ImageVersion;
            NoInstallerExecuted=$true;NoCpuTestExecuted=$true;
            NoPersonalComputerTouched=$true;NoRawUserPathsOrFilesExported=$true;
            Status=if($flags.Count -gt 0){'R195_FAILING_GUARD_REPRODUCED'}else{'R195_INITIAL_STATE_NOT_REPRODUCED'}
          }
          [IO.File]::WriteAllText((Join-Path $dir 'RESULT_R197.json'),($receipt|ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
          "R197_HOST_DIAG_BUILD="+$buildStatus
          "R197_TRIGGERED_GUARDS="+($flags -join ',')
          if($buildStatus -cne 'PASS_EXACT_R190_BINARY'){throw 'R197_BUILD_FAILED_DIAGNOSTIC_STILL_RETAINED'}
      - name: Retain only sanitized diagnostic result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R197-prestate-${{ matrix.host }}
          retention-days: 21
          if-no-files-found: warn
          path: ${{ runner.temp }}/R197_PRESTATE_${{ matrix.host }}/RESULT_R197.json
