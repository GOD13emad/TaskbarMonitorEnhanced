name: Update README screenshot showcase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add screenshot section to README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Why this project exists'
          section = '''## Screenshots

These are real Windows 11 captures from the machine used during final acceptance testing — not mockups.

![Taskbar Monitor Enhanced running inside the Windows 11 taskbar](docs/screenshots/desktops/desktop-dark-minimal.webp)

### A few theme previews

![Dark Minimal](docs/screenshots/strips/theme-dark-minimal.webp)

![Sleek White](docs/screenshots/strips/theme-sleek-white.webp)

![Honeycomb Tech](docs/screenshots/strips/theme-honeycomb-tech.webp)

![Fluent Glass](docs/screenshots/strips/theme-fluent-glass.webp)

![OLED Mono](docs/screenshots/strips/theme-oled-mono.webp)

![Retro Terminal](docs/screenshots/strips/theme-retro-terminal.webp)

[View the screenshot gallery](docs/screenshots/README.md)

'''
          if '## Screenshots' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker was not found')
              text = text.replace(marker, section + marker, 1)
              p.write_text(text, encoding='utf-8')

      - name: Commit README update and remove bootstrap workflow
        shell: bash
        run: |
          sleep 20
          git pull --rebase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/update-readme-gallery.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Show real screenshots in README"
          git push
