name: R126 Official Stable v1.7.0 to v1.7.1 Single-Root Upgrade

on:
  push:
    branches:
      - audit/r126-stable170-to-patch171
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-stable-upgrade:
    name: Official v1.7.0 to patch v1.7.1 (${{ matrix.host }})
    runs-on: windows-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        host: [A, B]
    steps:
      - name: Fresh source checkout exact triggered commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Preflight disposable Windows host and clean project source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'R126 refuses non-disposable host'
          }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) {throw 'R126 exact checkout drift'}
          ./build/Test-Stable170-InPlace-R126.ps1 -StaticOnly
          git diff --check HEAD
          if ($LASTEXITCODE -ne 0) {throw 'R126 static/diff check'}
      - name: Build independent deterministic source and verified unsigned Setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Build.ps1
          $main=(Get-FileHash ./build/_out/App/TaskbarMonitorEnhanced.exe -Algorithm SHA256).Hash
          $setup=(Get-FileHash ./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.1.exe -Algorithm SHA256).Hash
          if ($main -cne 'C79064C6A284F2D6537D28D500D07621BEEF050BDCEA794495DB5B2AAE8A0AC1' -or
              $setup -cne '94030A2FB3D6CE57C5796F210FB9E2F6B986B312367441689589BEFEA762282F') {
            throw ('R126 deterministic Main/Setup SHA failed Main='+$main+' Setup='+$setup)
          }
          Write-Output ('R126_SOURCE_BINARIES_EXACT_SHA_PASS MAIN='+$main+' SETUP='+$setup)
      - name: REAL PUBLIC 1.7.0 installed same-root patch upgrade, negative edit, no duplicate, rollback/idempotence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-Stable170-InPlace-R126.ps1
          if ($LASTEXITCODE -ne 0) {throw 'R126 public stable in-place regression failed'}
          $f=Join-Path $env:RUNNER_TEMP 'TBME_R126_STABLE_UPDATE/R126_STABLE_UPDATE_RECEIPT.json'
          if (!(Test-Path -LiteralPath $f -PathType Leaf)){throw 'R126 missing real installed update receipt'}
          $r=Get-Content -LiteralPath $f -Raw|ConvertFrom-Json
          if ($r.EventCommit -cne $env:GITHUB_SHA -or
              $r.Status -cne 'PASS_REAL_PUBLIC_STABLE_V170_TO_PATCH_V171_SINGLE_ROOT' -or
              $r.NegativeEdit -cne 'PASS_REFUSED_EDIT_WITHOUT_OVERWRITE' -or
              $r.Upgrade -cne 'PASS_OFFICIAL_V170_TO_V171_SAME_ROOT_EXACT_USER_SHAS' -or
              $r.Idempotence -cne 'PASS_IDEMPOTENT_NO_USER_CHANGE' -or
              $r.Downgrade -cne 'PASS_NO_DOWNGRADE' -or
              $r.PersonalInstallTouched -ne $false) {
            throw 'R126 evidence incomplete / semantic acceptance failed'
          }
          Write-Output ('R126_STABLE_170_TO_PATCH_171_NATIVE_PASS HOST=${{ matrix.host }} SHA256='+
            (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash)
      - name: Preserve all real native user-install receipts even on FAIL
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R126-stable-inplace-${{ matrix.host }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TBME_R126_STABLE_UPDATE/**
