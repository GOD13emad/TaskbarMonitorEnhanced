name: R225 - Exact HKCU installation and startup registry backup fault and restore on disposable Windows
on:
  push:
    branches: [audit/r225-disposable-registry-rollback]
permissions:
  contents: read
jobs:
  cold-install-root:
    name: Exact v1.7.2 HKCU uninstall and startup registry rollback on disposable host ${{ matrix.host }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [A, B]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse owner host and verify test-only exact source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced' -or
             $env:GITHUB_REF -cne 'refs/heads/audit/r225-disposable-registry-rollback'){
              throw 'R224_REFUSE_NOT_DISPOSABLE_GITHUB_HOST'
          }
          $base='da5b919d8e0bddde46c6351b0269041e4d407c72'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){throw 'R225_EXPECTED_R224_PARENT_NOT_ANCESTOR'}
          $files=@(git diff --name-only $base HEAD)
          $allowed=@('.github/workflows/audit-cold-r224.yml','build/Test-HostedRegistry-R225.ps1')
          if($files.Count -ne 2 -or @($files|Where-Object {$_ -cnotin $allowed}).Count){
              throw 'R225_REGISTRY_ONLY_SCOPE_NOT_EXACT'
          }
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'R225_UNEXPECTED_COMMIT'}
          $h=(Get-FileHash './src/TaskbarMonitorEnhanced.cs' -Algorithm SHA256).Hash
          if($h -cne '4AF4A6C05AFC18E6390D918A10B3CE35A4AF948C7451EF9604311A816C313E3F'){
              throw 'R225_PRODUCT_SOURCE_CHANGED'
          }
          # Windows checkout converts LF to CRLF; validate canonical LF source bytes
          # rather than platform-specific on-disk newline encoding.
          $raw=[IO.File]::ReadAllText('./build/Test-HostedColdRestore-R224.ps1',[Text.Encoding]::UTF8)
          $lf=$raw.Replace(([string][char]13+[string][char]10),([string][char]10)).Replace(([string][char]13),([string][char]10))
          $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($lf)))
          if($sha -cne 'B6A8FB996C8DAC4922FF51DFD53D53F6EC988E71926FC77A2FCD64A275D0330B'){
              throw 'R224_COLD_RUNNER_NORMALIZED_LF_SHA_CHANGED'
          }
          $new=[IO.File]::ReadAllText('./build/Test-HostedRegistry-R225.ps1',[Text.Encoding]::UTF8)
          $canonical=$new.Replace(([string][char]13+[string][char]10),([string][char]10)).Replace(([string][char]13),([string][char]10))
          $newSha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($canonical)))
          if($newSha -cne 'BD7AF648BF2EDB6218835ACD896B841912179975FD235DDDE9864C15A074473B'){
              throw 'R225_NEW_REGISTRY_RUNNER_NORMALIZED_SHA_DRIFT'
          }
          $t=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile('./build/Test-HostedRegistry-R225.ps1',
                 [ref]$t,[ref]$errors)
          if(@($errors).Count){throw 'R225_NEW_RUNNER_PS_PARSER_FAILED'}
          # Unit regression from real failed run R225-F01: $args is a reserved
          # PowerShell automatic variable and cannot serve as named input.
          function R225-BadArgs([string]$file,[string]$args){return [string]$args}
          function R225-GoodArgs([string]$file,[string]$installerArguments){return [string]$installerArguments}
          $want='/install /quiet /desktop=0 /startup=0'
          if((R225-BadArgs 'dummy.exe' $want) -cne '' -or
             (R225-GoodArgs 'dummy.exe' $want) -cne $want -or
             !$new.Contains('function Install([string]$setup,[string]$installerArguments)') -or
             !$new.Contains('SILENT_INSTALL_ARGS_NOT_BOUND_EXACTLY')){
              throw 'R225_F01_AUTOMATIC_ARGS_NEGATIVE_AND_POSITIVE_REGRESSION'
          }
          if(Test-Path (Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced')){
              throw 'R225_NOT_FRESH_OR_USER_DATA_PRESENT'
          }
          if(@(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count){
              throw 'R225_EXISTING_GUEST_APP_PROCESS'
          }
          'R225_HOST_AND_SOURCE_PREFLIGHT=PASS'
      - name: Real guest HKCU full-value backup, intentional fault and exact type-preserving restoration
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-HostedRegistry-R225.ps1 -Machine '${{ matrix.host }}'
          if($LASTEXITCODE -ne 0){throw 'R225_REGISTRY_TEST_RUNNER_FAILED'}
          $p=Join-Path $env:RUNNER_TEMP 'TBME_R225_REGISTRY_${{ matrix.host }}\R225_REAL_HKCU_REGISTRY_RESTORE.json'
          if(!(Test-Path $p -PathType Leaf)){throw 'R225_RECEIPT_NOT_CREATED'}
          $v=Get-Content $p -Raw | ConvertFrom-Json
          if($v.Status -cne 'PASS_REAL_GUEST_EXACT_HKCU_INSTALL_STARTUP_REGISTRY_BACKUP_FAULT_RESTORE' -or
             $v.GuestMainStillOfficial -ne $true -or $v.RestoredByteAndTypeExact -ne $true -or
             $v.FaultInjected -ne $true -or $v.RegistryRestoreFunctionExecuted -ne $true -or
             $v.UserPersonalComputerTouched -ne $false){throw 'R225_POST_RESTORE_REGISTRY_RECEIPT_NOT_ACCEPTED'}
          'R225_DISPOSABLE_EXACT_HKCU_RESTORE=PASS'
      - name: Preserve exact real guest HKCU registry restoration receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R225-disposable-registry-${{ matrix.host }}
          if-no-files-found: warn
          retention-days: 21
          path: ${{ runner.temp }}/TBME_R225_REGISTRY_${{ matrix.host }}/R225_REAL_HKCU_REGISTRY_RESTORE.json
