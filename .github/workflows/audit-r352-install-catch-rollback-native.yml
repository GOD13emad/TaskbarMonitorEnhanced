name: R352 exact Helper Install catch and rollback (disposable Windows)
on:
  push:
    branches: [security/r347-r349-helper-hardening-v1710]
    paths:
      - installer/TaskbarMonitorEnhanced_Setup.cs
      - installer/TBME_Setup_Elevated_Helper.ps1
      - build/Test-R352-InstallCatchRollback-Native.ps1
      - .github/workflows/audit-r352-install-catch-rollback-native.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-install-catch-rollback:
    name: R352 actual Install catch rollback ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: A
            os: windows-2025
          - host: B
            os: windows-2022
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce disposable already-admin Windows and empty exact targets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced' -or
             $env:GITHUB_REF -cne 'refs/heads/security/r347-r349-helper-hardening-v1710' -or
             $env:COMPUTERNAME -match '(?i)EMAD-PC|ALIEMAD|SAEID|LAPTOP' -or
             (git rev-parse HEAD).Trim() -cne '${{ github.sha }}'){
            throw 'R352_HOST_OR_COMMIT_NOT_DISPOSABLE'
          }
          $programFiles=[Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFiles)
          $profile=[Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)
          $product=Join-Path $programFiles 'TaskbarMonitorEnhanced'
          $app=Join-Path $profile 'AppData\Local\TaskbarMonitorEnhanced'
          $pawn='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO'
          $pawnWow='HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\PawnIO'
          Import-Module ScheduledTasks -ErrorAction Stop
          if((Test-Path -LiteralPath $product) -or
             (Test-Path -LiteralPath $app) -or
             (Test-Path -LiteralPath $pawn) -or
             (Test-Path -LiteralPath $pawnWow) -or
             @(Get-ScheduledTask -TaskPath '\' -TaskName 'TaskbarMonitorEnhanced Sensor Broker' -ErrorAction SilentlyContinue | Where-Object {$null -ne $_}).Count -or
             @(Get-Process TaskbarMonitorEnhanced,TaskbarMonitorSensorBroker,TaskbarMonitorSensorSupervisor -ErrorAction SilentlyContinue).Count){
            throw 'R352_HOST_HAS_PREEXISTING_PRODUCT_APP_TASK_OR_PAWNIO'
          }
          $isAdmin=[Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          if(-not $isAdmin.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)){
            throw 'R352_NO_EXISTING_ADMIN_TOKEN'
          }
          'R352_DISPOSABLE_EMPTY_TARGETS_ALREADY_ADMIN_PASS'
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
      - name: Build exact Setup PE with embedded production Helper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Build.ps1
          if($LASTEXITCODE -ne 0 -or
             !(Test-Path -LiteralPath build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.10.exe)){
            throw 'R352_EXACT_COMPILED_SETUP_MISSING'
          }
          'R352_EXACT_COMPILED_SETUP_BUILD_PASS'
      - name: Execute exact PE Helper Install path with one controlled post-registration failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $native=Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell\v1.0\powershell.exe'
          $test=(Resolve-Path build/Test-R352-InstallCatchRollback-Native.ps1).Path
          $source=(Resolve-Path .).Path
          & $native -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test -HostLabel '${{ matrix.host }}' -SourceRoot $source
          if($LASTEXITCODE -ne 0){throw 'R352_ACTUAL_INSTALL_CATCH_ROLLBACK_NOT_ACCEPTED'}
      - name: Retain raw native install rollback receipt and helper transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R352-${{ matrix.host }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/R352_*/R352_INSTALL_CATCH_ROLLBACK_NATIVE.json
            ${{ runner.temp }}/R352_*/R352_HELPER_OUTPUT.log
            ${{ runner.temp }}/R352_*/R352_PREVIOUS_TASK_XML.xml
          retention-days: 7
          if-no-files-found: warn
