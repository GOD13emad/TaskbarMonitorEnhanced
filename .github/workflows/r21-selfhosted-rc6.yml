name: R21 RC6 Ephemeral Self-Hosted Validation

on:
  push:
    branches:
      - audit/r21-final-hardening-rc6

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate:
    if: github.repository == 'GOD13emad/TaskbarMonitorEnhanced'
    runs-on:
      - self-hosted
      - Windows
      - X64
      - tbme-rc6-jit
    timeout-minutes: 25
    steps:
      - name: Checkout sealed RC6 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate preinstalled .NET SDK
        shell: powershell
        run: |
          $dotnet = Join-Path $env:ProgramFiles 'dotnet\dotnet.exe'
          if (!(Test-Path -LiteralPath $dotnet)) { throw "dotnet.exe not found at $dotnet" }
          $sdk = (& $dotnet --version).Trim()
          if ($sdk -ne '10.0.400') { throw "Expected .NET SDK 10.0.400, got $sdk" }
          Write-Host "DOTNET_SDK=PASS $sdk"

      - name: Resolve real PowerShell 7
        shell: powershell
        run: |
          $pkg = Get-AppxPackage Microsoft.PowerShell | Sort-Object Version -Descending | Select-Object -First 1
          if (!$pkg) { throw 'Microsoft.PowerShell AppX package not found.' }
          $pwsh = Join-Path $pkg.InstallLocation 'pwsh.exe'
          if (!(Test-Path -LiteralPath $pwsh)) { throw "PowerShell 7 executable not found: $pwsh" }
          "TBME_PWSH=$pwsh" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TBME_PWSH=PASS $pwsh"

      - name: Git whitespace check
        shell: powershell
        run: git diff --check HEAD^

      - name: Reproducible R21 build
        shell: powershell
        run: |
          & $env:TBME_PWSH -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Build-R21.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify deterministic clean-clone build
        shell: powershell
        run: |
          & $env:TBME_PWSH -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Verify-Determinism.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SPDX 2.3 SBOM
        shell: powershell
        run: |
          & $env:TBME_PWSH -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./build/Generate-Sbom.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attest binary build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'build/_out/**/*.exe'

      - name: Attest Setup SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'build/_out/Setup/TaskbarMonitorEnhanced_Setup_*.exe'
          sbom-path: 'artifacts/R21_SBOM.spdx.json'

      - name: Upload verified RC6 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r21-rc6-selfhosted-evidence
          if-no-files-found: error
          path: |
            artifacts/R21_BUILD_MANIFEST.json
            artifacts/R21_SBOM.spdx.json
            build/_out/App/TaskbarMonitorEnhanced.exe
            build/_out/Broker/TaskbarMonitorSensorBroker.exe
            build/_out/Supervisor/TaskbarMonitorSensorSupervisor.exe
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_*.exe
