name: R125 Anchored Glass Foreground Plus Pinned Start and Native Settings
on:
  push:
    branches:
      - audit/r125-anchor-and-foreground-glass
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-private:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Exact checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: All static guards on original and new bounded real VM tests
        shell: pwsh
        run: |
          ./build/Test-G14-PrivateCandidate-R118.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R108 R107 static denied' }
          ./build/Test-PrivateWide-R118.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R108 native bounded display static denied' }
          ./build/Test-DisposablePawnIO-R109.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R109 official driver preflight denied' }
          & powershell.exe -NoProfile -File ./build/Test-DisposablePawnIO-R109.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R109 official driver PS5.1 parser denied' }
          & powershell.exe -NoProfile -File ./build/Test-PrivateWide-R118.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R108 PS5 static denied' }
      - name: Build exact candidate, no signature, deterministic Main and Setup hashes
        shell: pwsh
        run: |
          ./build/Build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R108 source Setup/Main build denied' }
          $main=(Get-FileHash ./build/_out/App/TaskbarMonitorEnhanced.exe -Algorithm SHA256).Hash
          $setup=(Get-FileHash ./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe -Algorithm SHA256).Hash
          if ($main -cne 'D91329A7677B334C57B1064889AFC3B1176593F20160D36D976CF32418F924F7' -or
              $setup -cne '578A4055DB28BB2D24C664677510D5A0C5B0BEC6D8937D261D1EB0BB1AE86C7E'){
              throw 'R108 source or embedded Main Setup SHA drift'
          }
          Write-Output ('R108_EXACT_UNSIGNED_PRIVATE_SHA MAIN='+$main+' SETUP='+$setup)
      - name: Transfer only exact private binary candidate, no public Release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R125-anchor-glass-private-binaries
          retention-days: 21
          if-no-files-found: error
          path: |
            build/_out/App/TaskbarMonitorEnhanced.exe
            build/_out/App/TaskbarMonitorEnhanced.exe.config
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe

  installed-g14:
    needs: build-private
    runs-on: windows-latest
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        session: [A, B]
    steps:
      - name: Fresh Windows runner source checkout with no write access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Obtain exact candidate binary from build-private without installing twice
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: R125-anchor-glass-private-binaries
          path: build/_out
      - name: Verify immutable candidate bytes and clean host environment
        shell: pwsh
        run: |
          $main=(Get-FileHash ./build/_out/App/TaskbarMonitorEnhanced.exe -Algorithm SHA256).Hash
          $setup=(Get-FileHash ./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe -Algorithm SHA256).Hash
          if ($main -cne 'D91329A7677B334C57B1064889AFC3B1176593F20160D36D976CF32418F924F7' -or
              $setup -cne '578A4055DB28BB2D24C664677510D5A0C5B0BEC6D8937D261D1EB0BB1AE86C7E'){
              throw 'R108 private candidate SHA corrupted during transfer'
          }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced')){
              throw 'R108 fresh VM was not clean before temporary test'
          }
          ./build/Test-PrivateWide-R118.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R108 static guard refused exact hosted display experiment' }
      - name: Explicitly provision signed official pinned PawnIO v2.2 on disposable VM only
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
              throw 'R109 absolutely forbids driver installation outside disposable Windows'
          }
          ./build/Test-DisposablePawnIO-R109.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R109 signed official driver prerequisite failed; do not fake sensor data or reboot' }
      - name: Exact transient 1600 wide plus candidate install and eight actual G14; always rollback display
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){
              throw 'R108 refuses any non-disposable machine'
          }
          ./build/Test-PrivateWide-R118.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R108 display restore or actual private G14 diagnostic failed' }
      - name: Independent proof of native resolution rollback and fifteen plus seventeen hostile receipts
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'TBME_R108_PrivateWide'
          $candidate=Join-Path $env:RUNNER_TEMP 'TBME_R107_PRIVATE_CANDIDATE'
          ./build/Verify-PrivateWide-R118.ps1 -ReceiptPath (Join-Path $dir 'R108_WIDESCREEN_TRANSACTION_RECEIPT.json') -ExpectedCommit $env:GITHUB_SHA -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R108 actual restored mode verifier denied' }
          ./build/Verify-G14-PrivateCandidate-R118.ps1 -ReceiptPath (Join-Path $candidate 'R107_PRIVATE_CANDIDATE_RECEIPT.json') -ExpectedCommit $env:GITHUB_SHA -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R108 installed private G14 receipts rejected' }
          $p=Join-Path $env:RUNNER_TEMP 'TBME_R109_PawnIO/R109_OFFICIAL_PAWNIO_RECEIPT.json'
          $health=Join-Path $candidate 'G14_8/health.json'
          ./build/Verify-DisposablePawnIO-R109.ps1 -ReceiptPath $p -HealthPath $health -ExpectedCommit $env:GITHUB_SHA -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R109 protected signed driver/real CPU/GPU/Storage supervisor transport not healthy' }
          ./build/Verify-PostG14Log-R118.ps1 -ReceiptPath (Join-Path $candidate 'R107_PRIVATE_CANDIDATE_RECEIPT.json') -ExpectedCommit $env:GITHUB_SHA -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R111 live post-Start runtime log exact resident PID/SHA rejected' }
          $r112Trace=Join-Path $candidate 'G14_8/start/START_PINNED_PROOF.json'
          ./build/Verify-StartPinned-R118.ps1 -ManifestPath $r112Trace -CandidateReceiptPath (Join-Path $candidate 'R107_PRIVATE_CANDIDATE_RECEIPT.json') -ExpectedCommit $env:GITHUB_SHA -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R112 SHA/PID-bound native Start 80ms trace evidence missing or invalid' }
          $diag=Get-Content (Join-Path $candidate 'R107_PRIVATE_CANDIDATE_RECEIPT.json') -Raw|ConvertFrom-Json
          if ($diag.DiagnosticAttempts -ne 8 -or $diag.DiagnosticPasses -ne 8) {
            throw 'R109 real installed G14 diagnostic not 8/8; do not claim full acceptance'
          }
          Write-Output 'R109_DIAGNOSTIC_8_OF_8_PASSED_FORMAL_G14_SIGNED_LAB_STILL_OPEN'
      - name: R122 exact GUI process wait, true exit code and PID-bound Settings screen evidence
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
            throw 'R122 refuses any non-disposable Windows host'
          }
          $dir=Join-Path $env:RUNNER_TEMP 'TBME_R122_SETTINGS'
          if (Test-Path -LiteralPath $dir) { throw 'R122 unsafe rerun pre-existing probe output' }
          $exe=(Resolve-Path './build/_out/App/TaskbarMonitorEnhanced.exe').Path
          $expected='D91329A7677B334C57B1064889AFC3B1176593F20160D36D976CF32418F924F7'
          if ((Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -cne $expected) {
            throw 'R122 exact GUI input executable SHA drift'
          }
          $psi=[Diagnostics.ProcessStartInfo]::new()
          $psi.FileName=$exe
          $psi.WorkingDirectory=Split-Path -Parent $exe
          $psi.UseShellExecute=$false
          $psi.CreateNoWindow=$false
          [void]$psi.ArgumentList.Add('--settingsforegroundproof')
          [void]$psi.ArgumentList.Add([string]$dir)
          $child=$null
          $probePid=0
          $exitCode=-999
          try {
            $child=[Diagnostics.Process]::Start($psi)
            if ($null -eq $child) { throw 'R122 native WinExe process did not start' }
            $probePid=[int]$child.Id
            if (!$child.WaitForExit(65000)) {
              $child.Refresh()
              if (!$child.HasExited -and $child.Id -eq $probePid -and
                  (Get-Process -Id $probePid -ErrorAction SilentlyContinue).Path -ceq $exe) {
                $child.Kill()
                [void]$child.WaitForExit(5000)
              }
              throw 'R122 exact native GUI process 65s timeout'
            }
            $exitCode=[int]$child.ExitCode
          } finally {if ($null -ne $child) {$child.Dispose()}}
          if ($exitCode -ne 0) { throw ('R122 native GUI process returned nonzero '+$exitCode) }
          $receipt=Join-Path $dir 'SETTINGS_NATIVE_FOREGROUND_R121.json'
          if (!(Test-Path -LiteralPath $receipt -PathType Leaf)) {
            throw 'R122 real native Settings proof receipt missing after successful exact process exit'
          }
          Write-Output ('R122_NATIVE_GUI_EXIT=PASS PID='+$probePid+' CODE='+$exitCode+
            ' MAIN_SHA256='+$expected)
          ./build/Verify-SettingsForeground-R122.ps1 -ManifestPath $receipt -CandidateMainPath $exe -ExpectedCommit $env:GITHUB_SHA -ExpectedMainSha256 $expected -ExpectedProbePid $probePid -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'R122 independent real Settings foreground and exact process PID rejected' }
      - name: Preserve exact disposable native screen and installer raw evidence, even if test fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R125-anchor-glass-${{ matrix.session }}
          retention-days: 21
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TBME_R108_PrivateWide/**
            ${{ runner.temp }}/TBME_R107_PRIVATE_CANDIDATE/**
            ${{ runner.temp }}/TBME_R109_PawnIO/R109_OFFICIAL_PAWNIO_RECEIPT.json
            ${{ runner.temp }}/TBME_R122_SETTINGS/**
