name: R155 v1.7.2 Exact Upgrade and Native Acceptance
on:
  push:
    branches: [release/r155-v172-upgrade]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parser and versioned reproducible build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'R155 source drift'}
          foreach($p in @('build/Test-Upgrade171-R155.ps1','build/Test-UpgradeContract-R155.ps1','build/Test-Native-Presentation-R155.ps1')){
            $t=$null;$e=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$t,[ref]$e)
            if(@($e).Count){throw ('R155 parser '+$p)}
          }
          ./build/Build.ps1
          ./build/Generate-Sbom.ps1
          ./build/Verify-Release-Metadata-R155.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'R155 version/manifest/SPDX gate'}
          $main='./build/_out/App/TaskbarMonitorEnhanced.exe'
          $setup='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.2.exe'
          $c=[ordered]@{Commit=$env:GITHUB_SHA;Version='1.7.2';Private=$true;NotForPublicInstallation=$true;MainSHA256=(Get-FileHash $main -Algorithm SHA256).Hash;SetupSHA256=(Get-FileHash $setup -Algorithm SHA256).Hash}
          [IO.File]::WriteAllText((Join-Path $pwd 'build/_out/CANDIDATE.json'),($c|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
      - name: Actual compiled control, geometry, visibility and upgrade contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $main='./build/_out/App/TaskbarMonitorEnhanced.exe'
          ./build/Test-Appearance-R145.ps1 -MainPath $main -OutDir (Join-Path $env:RUNNER_TEMP 'R155_MODELS/APPEARANCE')
          ./build/Test-Geometry-R150.ps1 -MainPath $main -OutDir (Join-Path $env:RUNNER_TEMP 'R155_MODELS/GEOMETRY')
          ./build/Test-Visibility-R146.ps1 -MainPath $main -OutDir (Join-Path $env:RUNNER_TEMP 'R155_MODELS/VISIBILITY')
          ./build/Test-UpgradeContract-R155.ps1 -SetupPath ./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.2.exe -OutDir (Join-Path $env:RUNNER_TEMP 'R155_MODELS/UPGRADE')
      - name: Preserve one exact candidate installer, not a release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R155-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            build/_out/CANDIDATE.json
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.2.exe
      - name: Preserve model receipts and binary manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R155-compiled-contracts
          if-no-files-found: warn
          retention-days: 21
          path: |
            ${{ runner.temp }}/R155_MODELS/**
            artifacts/BUILD_MANIFEST.json
            artifacts/SBOM.spdx.json
  upgrade-and-native:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 24
    name: Real v1.7.1 upgrade and four native modes (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [A, B]
    steps:
      - name: Fresh independent Windows source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transfer exact previously compiled Setup bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R155-candidate
          path: build/_out
      - name: Genuine direct and inherited v1.7.1 protected upgrade
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-Upgrade171-R155.ps1 -CandidateDir ./build/_out -HostLabel '${{ matrix.host }}'
          $r=Get-Content (Join-Path $env:RUNNER_TEMP 'TBME_R155_UPGRADE_${{ matrix.host }}/R155_UPGRADE.json') -Raw|ConvertFrom-Json
          if($r.Status -cne 'PASS_GENUINE_171_TO_172_SINGLE_ROOT_PRESERVATION_ROLLBACK_IDEMPOTENCE' -or $r.Commit -cne $env:GITHUB_SHA){throw 'R155 actual updater acceptance failed'}
      - name: Native menu, Settings, Start, fullscreen and 1-percent regression on upgraded bytes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-Native-Presentation-R155.ps1 -CandidateDir ./build/_out -HostLabel '${{ matrix.host }}' -UseInstalledCandidate
          $r=Get-Content (Join-Path $env:RUNNER_TEMP 'TBME_R155_${{ matrix.host }}/R155_NATIVE.json') -Raw|ConvertFrom-Json
          if($r.Status -cne 'PASS_REAL_MENU_SETTINGS_START_FULLSCREEN_TASKBAR_VISIBILITY_FOUR_MODES' -or @($r.TestedModes).Count -ne 4 -or $r.EventCommit -cne $env:GITHUB_SHA){throw 'R155 native four-mode evidence not accepted'}
      - name: Preserve raw upgrade receipts and physical native pixels on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: R155-native-upgrade-${{ matrix.host }}
          if-no-files-found: warn
          retention-days: 21
          path: |
            ${{ runner.temp }}/TBME_R155_UPGRADE_${{ matrix.host }}/R155_UPGRADE.json
            ${{ runner.temp }}/TBME_R155_${{ matrix.host }}/**
