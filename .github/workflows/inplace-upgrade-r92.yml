name: R92 Genuine In-Place Data-Preserving Upgrade

on:
  push:
    branches:
      - audit/inplace-data-preserving-upgrade-r92
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-build:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - name: Checkout exact test-only source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - name: Build the immutable per-run unsigned candidate in isolated builder
        shell: pwsh
        run: |
          ./build/Build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R92 upgraded installer build failed.' }
          $p='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe'
          if ((Get-FileHash $p).Hash -cne 'A065CCF4C1F5F91AEF15ECCDD1ABB41FFAD4ABC57CD44F44B39A65740AD682B2') {
            throw 'R92 build bytes changed; never upload candidate as authorized input.'
          }
      - name: Upload exact SHA-bound candidate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R92-upgrade-candidate-unsigned-setup
          if-no-files-found: error
          retention-days: 7
          path: build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe

  upgrade-from-public-v16:
    needs: candidate-build
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout isolated source on fresh Windows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check pristine hosted installation prestate
        shell: pwsh
        run: |
          $p=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          if ((Test-Path -LiteralPath $p) -or
              (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced') -or
              @(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'R92 isolated hosted VM was NOT empty before product install. Never delete to make CI pass.'
          }
      - name: Static test script parser with zero host mutation
        shell: pwsh
        run: |
          ./build/Test-InPlace-Upgrade-R92.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R92 v1.6 clean-host preflight failed.' }
      - name: Download authorized candidate from independent build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: R92-upgrade-candidate-unsigned-setup
          path: build/_out/Setup
      - name: Reverify exact immutable candidate on pristine Windows
        shell: pwsh
        run: |
          $p='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe'
          if (!(Test-Path $p -PathType Leaf) -or
              (Get-FileHash $p).Hash -cne 'A065CCF4C1F5F91AEF15ECCDD1ABB41FFAD4ABC57CD44F44B39A65740AD682B2') {
            throw 'R92 downloaded artifact did not match trusted build candidate.'
          }
      - name: Real official v1.6 in-place update, data preservation and injected rollback
        shell: pwsh
        run: |
          ./build/Test-InPlace-Upgrade-R92.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R92 official v1.6 update failed. Review raw receipt before source change.' }
      - name: Always retain exact v1.6-to-v1.7 upgrade receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R92-inplace-upgrade-receipt
          retention-days: 21
          if-no-files-found: warn
          path: ${{ runner.temp }}/TBME_R92_InPlaceUpgrade/R92_INPLACE_UPGRADE_RECEIPT.json

  patch-existing-public-preview1:
    needs: candidate-build
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Checkout separate clean Windows test host
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify no existing product at beginning of test VM
        shell: pwsh
        run: |
          $p=Join-Path $env:LOCALAPPDATA 'TaskbarMonitorEnhanced'
          if ((Test-Path -LiteralPath $p) -or
              (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaskbarMonitorEnhanced') -or
              @(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'R92 Preview1 test runner must be fresh. Do not wipe user data.'
          }
      - name: Static source and test host protection
        shell: pwsh
        run: |
          ./build/Test-Preview1-Maintenance-R92.ps1 -StaticOnly
          if ($LASTEXITCODE -ne 0) { throw 'R92 preview maintenance static preflight failed.' }
      - name: Download exact SHA-bound candidate built on separate Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: R92-upgrade-candidate-unsigned-setup
          path: build/_out/Setup
      - name: Compare candidate setup SHA before touching Windows
        shell: pwsh
        run: |
          $p='./build/_out/Setup/TaskbarMonitorEnhanced_Setup_1.7.0.exe'
          if (!(Test-Path $p -PathType Leaf) -or
              (Get-FileHash $p).Hash -cne 'A065CCF4C1F5F91AEF15ECCDD1ABB41FFAD4ABC57CD44F44B39A65740AD682B2') {
            throw 'R92 candidate not identical to trusted separately built artifact.'
          }
      - name: Real existing public unsigned Preview1 same-version in-place upgrade and rollback
        shell: pwsh
        run: |
          ./build/Test-Preview1-Maintenance-R92.ps1
          if ($LASTEXITCODE -ne 0) { throw 'R92 public Preview1 maintenance upgrade failed; retain raw receipt.' }
      - name: Always preserve preview1 same-version data/rollback receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: R92-preview1-maintenance-receipt
          retention-days: 21
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TBME_R92_Preview1Maintenance/R92_PREVIEW1_MAINTENANCE_RECEIPT.json
            ${{ runner.temp }}/TBME_R92_Preview1Maintenance/R92_UPGRADE_ERROR.txt
