name: Add GPL-3.0 license text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-license.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official GNU GPL v3 text
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://www.gnu.org/licenses/gpl-3.0.txt \
            --output LICENSE
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 29 June 2007" LICENSE

      - name: Commit license and remove bootstrap workflow
        shell: bash
        run: |
          sleep 15
          git pull --rebase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git rm .github/workflows/materialize-license.yml
          git commit -m "Add GNU GPL v3 license"
          git push
