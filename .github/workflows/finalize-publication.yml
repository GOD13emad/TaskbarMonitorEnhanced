name: Finalize public repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-publication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize with latest main
        shell: bash
        run: |
          sleep 35
          git pull --rebase

      - name: Ensure real screenshot files exist
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          import base64, json, os, pathlib, urllib.request

          images = {
              'docs/screenshots/strips/theme-dark-minimal.webp': '638f6f33cce4ee0ffc4e347902b35db794e06166',
              'docs/screenshots/strips/theme-sleek-white.webp': '2b941de1ed5f01859f5f08e0a5918730bdedc113',
              'docs/screenshots/strips/theme-honeycomb-tech.webp': '50e3f6a5392874668806924e8ff7256cfde5867f',
              'docs/screenshots/strips/theme-fluent-glass.webp': '03abd3d04cf05c96beae60eca55a1dc59b82814e',
              'docs/screenshots/strips/theme-oled-mono.webp': '7cc00d004056685e89debfa565f905e3cbfb3de1',
              'docs/screenshots/strips/theme-retro-terminal.webp': 'ccc5c3828b0f0cccc0523012882aac1cb69cb9f9',
              'docs/screenshots/desktops/desktop-dark-minimal.webp': '8082f8c3feda4471ace0e0f062e4175abd6ebdd4',
          }

          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          for target, sha in images.items():
              path = pathlib.Path(target)
              if path.exists() and path.stat().st_size > 0:
                  continue
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              raw = base64.b64decode(payload['content'].replace('\n', ''))
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)

      - name: Ensure GPL-3.0 license exists
        shell: bash
        run: |
          if [ ! -s LICENSE ]; then
            curl --fail --location --retry 3 \
              https://www.gnu.org/licenses/gpl-3.0.txt \
              --output LICENSE
          fi
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 29 June 2007" LICENSE

      - name: Ensure screenshot showcase is linked from README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Why this project exists'
          section = '''## Screenshots

These are real Windows 11 captures from the machine used during final acceptance testing — not mockups.

![Taskbar Monitor Enhanced running inside the Windows 11 taskbar](docs/screenshots/desktops/desktop-dark-minimal.webp)

### A few theme previews

![Dark Minimal](docs/screenshots/strips/theme-dark-minimal.webp)

![Sleek White](docs/screenshots/strips/theme-sleek-white.webp)

![Honeycomb Tech](docs/screenshots/strips/theme-honeycomb-tech.webp)

![Fluent Glass](docs/screenshots/strips/theme-fluent-glass.webp)

![OLED Mono](docs/screenshots/strips/theme-oled-mono.webp)

![Retro Terminal](docs/screenshots/strips/theme-retro-terminal.webp)

[View the screenshot gallery](docs/screenshots/README.md)

'''
          if '## Screenshots' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker was not found')
              p.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

      - name: Remove temporary publication workflows
        shell: bash
        run: |
          rm -f .github/workflows/materialize-screenshots.yml
          rm -f .github/workflows/update-readme-gallery.yml
          rm -f .github/workflows/materialize-license.yml
          rm -f .github/workflows/finalize-publication.yml

      - name: Commit finalized publication state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize v1.0.0 public repository"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase
            sleep 5
          done
          exit 1
