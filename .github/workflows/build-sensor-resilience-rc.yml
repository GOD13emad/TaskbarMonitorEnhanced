name: Build sensor-resilient 1.0.1 RC1

on:
  push:
    branches:
      - fix/sensor-installer-resilience
    paths:
      - 'installer/TaskbarMonitorEnhanced_Setup.cs'
      - 'installer/TBME_Setup_Elevated_Helper.ps1'
      - 'installer/setup.manifest'
      - 'docs/RELEASE_NOTES_v1.0.1-rc1.md'
      - '.github/workflows/build-sensor-resilience-rc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RC_TAG: v1.0.1-rc1

    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4

      - name: Download accepted 1.0.0 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path base | Out-Null
          gh release download v1.0.0 `
            --pattern 'TaskbarMonitorEnhanced_Setup_1.0.0.exe' `
            --dir base
          $base = 'base\TaskbarMonitorEnhanced_Setup_1.0.0.exe'
          if (-not (Test-Path -LiteralPath $base)) { throw 'BASE_SETUP_DOWNLOAD_GATE' }
          $hash = (Get-FileHash -LiteralPath $base -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '57196706279272fa2d605331f34b5386a5ba3fba8f0f64e12ee65e4288f5a4e7') {
            throw "BASE_SETUP_SHA_GATE actual=$hash"
          }

      - name: Extract accepted payload from 1.0.0 Setup
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $base=(Resolve-Path 'base\TaskbarMonitorEnhanced_Setup_1.0.0.exe').Path
          $payload=Join-Path $PWD 'payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          $assembly=[Reflection.Assembly]::LoadFile($base)
          $names=@($assembly.GetManifestResourceNames())
          if ($names.Count -lt 19) { throw "BASE_RESOURCE_COUNT_GATE count=$($names.Count)" }

          foreach($name in $names){
            if(-not $name.StartsWith('Payload.')){ continue }
            $fileName=$name.Substring('Payload.'.Length)
            $out=Join-Path $payload $fileName
            $stream=$assembly.GetManifestResourceStream($name)
            if($null -eq $stream){ throw "RESOURCE_STREAM_GATE $name" }
            try{
              $file=[IO.File]::Create($out)
              try{ $stream.CopyTo($file) } finally { $file.Dispose() }
            } finally { $stream.Dispose() }
          }

          Copy-Item 'installer\TaskbarMonitorEnhanced_Setup.cs' (Join-Path $payload 'TaskbarMonitorEnhanced_Setup.cs') -Force
          Copy-Item 'installer\TBME_Setup_Elevated_Helper.ps1' (Join-Path $payload 'TBME_Setup_Elevated_Helper.ps1') -Force
          Remove-Item (Join-Path $payload 'RELEASE_NOTES_v1.0.0.md') -Force -ErrorAction SilentlyContinue
          Copy-Item 'docs\RELEASE_NOTES_v1.0.1-rc1.md' (Join-Path $payload 'RELEASE_NOTES_v1.0.1-rc1.md') -Force

          foreach($required in @(
            'TaskbarMonitorEnhanced.exe',
            'TaskbarMonitorEnhanced.cs',
            'TaskbarMonitorSensorBroker.exe',
            'TaskbarMonitorSensorBroker.cs',
            'TaskbarMonitorSensorSupervisor.exe',
            'TaskbarMonitorSensorSupervisor.cs',
            'TaskbarMonitorEnhanced.ico',
            'LibreHardwareMonitor.zip',
            'PawnIO_setup.exe',
            'TBME_Setup_Elevated_Helper.ps1',
            'LICENSE',
            'README.md',
            'AUTHORS.md',
            'COPYRIGHT_AND_ATTRIBUTION.md',
            'AI_ASSISTED_DEVELOPMENT.md',
            'THIRD_PARTY_NOTICES.md',
            'RELEASE_NOTES_v1.0.1-rc1.md',
            'UPSTREAM_REFERENCE_GPL_NOTICE.md',
            'TaskbarMonitorEnhanced_Setup.cs'
          )){
            $p=Join-Path $payload $required
            if(-not(Test-Path -LiteralPath $p) -or (Get-Item -LiteralPath $p).Length -eq 0){
              throw "PAYLOAD_GATE $required"
            }
          }

      - name: Static resilience gates
        shell: pwsh
        run: |
          $setup=Get-Content 'installer\TaskbarMonitorEnhanced_Setup.cs' -Raw
          $helper=Get-Content 'installer\TBME_Setup_Elevated_Helper.ps1' -Raw

          foreach($token in @(
            '1.0.1-rc1',
            '/repair-sensors',
            'sensor_install_result.json',
            'CPU temperature will show N/A',
            'Application.DoEvents()'
          )){
            if($setup.IndexOf($token,[StringComparison]::Ordinal) -lt 0){
              throw "SETUP_RESILIENCE_TOKEN_GATE $token"
            }
          }

          foreach($token in @(
            'WaitForExit(60000)',
            'REBOOT_REQUIRED',
            'sensor_install.log',
            "Write-Result 'DEGRADED'",
            'exit 0'
          )){
            if($helper.IndexOf($token,[StringComparison]::Ordinal) -lt 0){
              throw "HELPER_RESILIENCE_TOKEN_GATE $token"
            }
          }

          if($helper -match "Start-Process.+PawnPayload.+-Wait"){
            throw 'PAWNIO_UNBOUNDED_WAIT_REGRESSION_GATE'
          }

      - name: Compile 1.0.1 RC1 Setup
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $csc=@(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if(-not$csc){ throw 'CSC_GATE' }
          $framework=Split-Path -Parent $csc

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $setupExe=(Join-Path $PWD 'artifacts\TaskbarMonitorEnhanced_Setup_1.0.1-rc1.exe')
          $rsp=(Join-Path $PWD 'artifacts\setup.rsp')
          $payload=(Join-Path $PWD 'payload')

          $lines=[System.Collections.Generic.List[string]]::new()
          foreach($x in @('/nologo','/target:winexe','/platform:anycpu','/optimize+','/debug-','/langversion:5')){
            [void]$lines.Add($x)
          }
          [void]$lines.Add('/out:"'+$setupExe+'"')
          [void]$lines.Add('/win32icon:"'+(Join-Path $payload 'TaskbarMonitorEnhanced.ico')+'"')
          [void]$lines.Add('/win32manifest:"'+(Join-Path $PWD 'installer\setup.manifest')+'"')

          foreach($ref in @(
            'System.dll','System.Core.dll','System.Drawing.dll','System.Windows.Forms.dll',
            'System.IO.Compression.dll','System.IO.Compression.FileSystem.dll'
          )){
            [void]$lines.Add('/reference:"'+(Join-Path $framework $ref)+'"')
          }

          $resources=@(
            @('TaskbarMonitorEnhanced.exe','Payload.TaskbarMonitorEnhanced.exe'),
            @('TaskbarMonitorEnhanced.cs','Payload.TaskbarMonitorEnhanced.cs'),
            @('TaskbarMonitorSensorBroker.exe','Payload.TaskbarMonitorSensorBroker.exe'),
            @('TaskbarMonitorSensorBroker.cs','Payload.TaskbarMonitorSensorBroker.cs'),
            @('TaskbarMonitorSensorSupervisor.exe','Payload.TaskbarMonitorSensorSupervisor.exe'),
            @('TaskbarMonitorSensorSupervisor.cs','Payload.TaskbarMonitorSensorSupervisor.cs'),
            @('TaskbarMonitorEnhanced.ico','Payload.TaskbarMonitorEnhanced.ico'),
            @('LibreHardwareMonitor.zip','Payload.LibreHardwareMonitor.zip'),
            @('PawnIO_setup.exe','Payload.PawnIO_setup.exe'),
            @('TBME_Setup_Elevated_Helper.ps1','Payload.TBME_Setup_Elevated_Helper.ps1'),
            @('LICENSE','Payload.LICENSE'),
            @('README.md','Payload.README.md'),
            @('AUTHORS.md','Payload.AUTHORS.md'),
            @('COPYRIGHT_AND_ATTRIBUTION.md','Payload.COPYRIGHT_AND_ATTRIBUTION.md'),
            @('AI_ASSISTED_DEVELOPMENT.md','Payload.AI_ASSISTED_DEVELOPMENT.md'),
            @('THIRD_PARTY_NOTICES.md','Payload.THIRD_PARTY_NOTICES.md'),
            @('RELEASE_NOTES_v1.0.1-rc1.md','Payload.RELEASE_NOTES_v1.0.1-rc1.md'),
            @('UPSTREAM_REFERENCE_GPL_NOTICE.md','Payload.UPSTREAM_REFERENCE_GPL_NOTICE.md'),
            @('TaskbarMonitorEnhanced_Setup.cs','Payload.TaskbarMonitorEnhanced_Setup.cs')
          )
          foreach($item in $resources){
            [void]$lines.Add('/resource:"'+(Join-Path $payload $item[0])+'","'+$item[1]+'"')
          }
          [void]$lines.Add('"'+(Join-Path $PWD 'installer\TaskbarMonitorEnhanced_Setup.cs')+'"')

          [IO.File]::WriteAllLines($rsp,$lines,[Text.UTF8Encoding]::new($true))
          if(([IO.File]::ReadAllText($rsp)).IndexOf([char]39) -ge 0){
            throw 'CSC_RESPONSE_APOSTROPHE_GATE'
          }

          & $csc ('@'+$rsp)
          if($LASTEXITCODE -ne 0){ throw "SETUP_COMPILE_GATE exit=$LASTEXITCODE" }
          if(-not(Test-Path -LiteralPath $setupExe)){ throw 'SETUP_EXE_GATE' }

      - name: Verify embedded resources
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'artifacts\TaskbarMonitorEnhanced_Setup_1.0.1-rc1.exe').Path
          $verify=(Join-Path $PWD 'artifacts\SETUP_VERIFY.json')
          $p=Start-Process -FilePath $setup -ArgumentList @('/verify',('/verifyfile="'+$verify+'"')) -Wait -PassThru
          if($p.ExitCode -ne 0){ throw "VERIFY_EXIT_GATE exit=$($p.ExitCode)" }
          if(-not(Test-Path -LiteralPath $verify)){ throw 'VERIFY_FILE_GATE' }
          $v=Get-Content -LiteralPath $verify -Raw | ConvertFrom-Json
          if([string]$v.Status -ne 'PASS' -or [int]$v.Resources -ne 19 -or [string]$v.Version -ne '1.0.1-rc1'){
            throw "VERIFY_CONTENT_GATE status=$($v.Status) resources=$($v.Resources) version=$($v.Version)"
          }

      - name: Build corresponding-source archive
        shell: pwsh
        run: |
          $src=Join-Path $PWD 'source-package'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          foreach($name in @(
            'TaskbarMonitorEnhanced.cs',
            'TaskbarMonitorSensorBroker.cs',
            'TaskbarMonitorSensorSupervisor.cs',
            'LICENSE',
            'README.md',
            'AUTHORS.md',
            'COPYRIGHT_AND_ATTRIBUTION.md',
            'AI_ASSISTED_DEVELOPMENT.md',
            'THIRD_PARTY_NOTICES.md',
            'UPSTREAM_REFERENCE_GPL_NOTICE.md'
          )){
            Copy-Item (Join-Path $PWD ('payload\'+$name)) (Join-Path $src $name) -Force
          }
          Copy-Item 'installer\TaskbarMonitorEnhanced_Setup.cs' (Join-Path $src 'TaskbarMonitorEnhanced_Setup.cs') -Force
          Copy-Item 'installer\TBME_Setup_Elevated_Helper.ps1' (Join-Path $src 'TBME_Setup_Elevated_Helper.ps1') -Force
          Copy-Item 'installer\setup.manifest' (Join-Path $src 'setup.manifest') -Force
          Copy-Item 'docs\RELEASE_NOTES_v1.0.1-rc1.md' (Join-Path $src 'RELEASE_NOTES_v1.0.1-rc1.md') -Force

          $zip=Join-Path $PWD 'artifacts\TaskbarMonitorEnhanced_1.0.1-rc1_SOURCE.zip'
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath $zip -Force

          $setupHash=(Get-FileHash 'artifacts\TaskbarMonitorEnhanced_Setup_1.0.1-rc1.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$setupHash  TaskbarMonitorEnhanced_Setup_1.0.1-rc1.exe",
            "$sourceHash  TaskbarMonitorEnhanced_1.0.1-rc1_SOURCE.zip"
          ) | Set-Content 'artifacts\SHA256SUMS.txt' -Encoding ascii
          Write-Host "SETUP_SHA256=$setupHash"
          Write-Host "SOURCE_SHA256=$sourceHash"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMonitorEnhanced-1.0.1-rc1
          path: artifacts/*

      - name: Publish validation pre-release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release view $env:RC_TAG *> $null
          if($LASTEXITCODE -eq 0){
            gh release delete $env:RC_TAG --yes --cleanup-tag
          }
          gh release create $env:RC_TAG `
            'artifacts\TaskbarMonitorEnhanced_Setup_1.0.1-rc1.exe' `
            'artifacts\TaskbarMonitorEnhanced_1.0.1-rc1_SOURCE.zip' `
            'artifacts\SHA256SUMS.txt' `
            --target $env:GITHUB_SHA `
            --title 'Taskbar Monitor Enhanced 1.0.1 RC1 - Sensor Installer Resilience' `
            --notes-file 'docs\RELEASE_NOTES_v1.0.1-rc1.md' `
            --prerelease
