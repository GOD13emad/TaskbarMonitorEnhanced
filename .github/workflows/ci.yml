name: Build and Verification

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'audit/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400

      # Run before any other fixture can create the canonical LocalAppData AppRoot.
      # The test owns and removes that exact root on this fresh GitHub-hosted runner.
      - name: R85 absent PawnIO must degrade safely without driver or sensor mutation
        shell: pwsh
        run: |
          ./build/Test-PawnIO-External-Degrade.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Optional driver missing state tried unsafe protected mutation.' }

      - name: Git whitespace check
        shell: pwsh
        run: git diff --check HEAD^

      - name: G13 G14 independent host witness contracts (22 adversarial scenarios)
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          python -B ./build/verify_host_acceptance.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Host proof parser failed.' }
          python -B ./build/test_host_acceptance.py
          if ($LASTEXITCODE -ne 0) { throw 'G13/G14 signed witness contract regressions failed.' }
          $registry = Get-Content ./build/host_acceptance_trust.json -Raw | ConvertFrom-Json
          if ($registry.Schema -ne 1 -or @($registry.TrustedWitnesses).Count -ne 0) { throw 'Unreviewed production lab key detected.' }

      - name: G15 SignPath request origin/signed payload contract (negative regression)
        shell: pwsh
        run: |
          python -B ./build/verify_signpath_g15.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'G15 Python static parser failed.' }
          python -B ./build/test_signpath_g15.py
          if ($LASTEXITCODE -ne 0) { throw 'G15 provider origin/signed artifact regression failed.' }
          # This never signs or invokes the real provider; real G15 acceptance stays external.

      - name: G16 public release asset contract (32 hostile regressions)
        shell: pwsh
        run: |
          python -B ./build/verify_public_release_g16.py --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'G16 Python parser/static preflight failed.' }
          python -B ./build/test_public_release_g16.py
          if ($LASTEXITCODE -ne 0) { throw 'G16 release manifest, SHA256SUMS and CI negative regressions failed.' }

      - name: Reproducible build
        shell: pwsh
        run: ./build/Build.ps1

      - name: R398 compiled Updater rejects parent junction and redirects before writes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R398-UpdateReparseAncestor.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($mark in @(
            'R398_PASS_REAL_COMPILED_VERIFIER_ACCEPTS_UNLINKED_FIXTURE',
            'R398_PASS_COMPILED_VERIFIER_REJECTS_PARENT_JUNCTION',
            'R398_PASS_COMPILED_PREWRITE_GUARD_REJECTS_JUNCTION',
            'R398_PASS_COMPILED_PREWRITE_GUARD_ACCEPTS_NORMAL_PATH',
            'R398_PASS_FIXTURE_CONTENT_UNCHANGED',
            'R398_PASS_NO_INSTALLER_LAUNCHED',
            'R398_RESULT=PASS_SCOPED_UPDATER_PARENT_JUNCTION_BLOCKED'
          )){
            if($proof -cnotcontains $mark){throw ('R398_MISSING_NATIVE_REPARSE_PROOF_'+$mark)}
          }
          $proof

      - name: R400 real compiled updater staging protects existing hardlink and rejects junction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R400-UpdateStaging-CreateNew.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($mark in @(
            'R400_PASS_COMPILED_CREATE_NEW_VERIFIED_STREAM_AND_DIGEST',
            'R400_PASS_EXISTING_STAGING_NEVER_TRUNCATED',
            'R400_PASS_PREPLANTED_HARDLINK_CANARY_UNCHANGED',
            'R400_PASS_BAD_DIGEST_FAILS_CLOSED_AND_CLEANS_OWN_STAGING',
            'R400_PASS_TINY_TRANSFER_REJECTED',
            'R400_PASS_DISALLOWED_STAGING_PATH_REJECTED',
            'R400_PASS_PARENT_JUNCTION_REJECTED_BEFORE_WRITE',
            'R400_PASS_OUTSIDE_CANARY_BYTE_IDENTICAL',
            'R400_PASS_NO_NETWORK_REQUEST_OR_INSTALLER_LAUNCH',
            'R400_RESULT=PASS_SCOPED_UNPREDICTABLE_CREATE_NEW_STAGING'
          )){
            if($proof -cnotcontains $mark){throw ('R400_MISSING_COMPILED_NATIVE_STAGING_PROOF_'+$mark)}
          }
          $proof
      - name: R408 compiled Broker self-enforced owner output boundary
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R408-BrokerOutputBoundary.ps1 -BrokerPath ./build/_out/Broker/TaskbarMonitorSensorBroker.exe -SourceRoot . -HostedGuest)
          foreach($mark in @(
            'R408_PASS_THREE_EXACT_MODE_AND_OUTPUT_PATHS_PINNED',
            'R408_PASS_FOURTEEN_INVALID_MODE_AND_OWNER_OUTPUT_BINDINGS_REFUSED',
            'R408_PASS_PIN_RELEASE_AND_DIRECTORY_RENAME_RECOVERY',
            'R408_PASS_EXTERNAL_CANARY_UNCHANGED',
            'R408_PASS_REAL_BROKER_EXE_REJECTS_OUTSIDE_OUTPUT_BEFORE_SENSORS',
            'R408_PASS_DISPOSABLE_SYNTHETIC_OWNER_ROOT_ATOMIC_WRITE_CREATE_AND_REPLACE',
            'R408_RESULT=PASS_COMPILED_BROKER_INDEPENDENT_OUTPUT_GUARD'
          )){
            if($proof -cnotcontains $mark){throw ('R408_HOSTED_BROKER_GUARD_PROOF_MISSING_'+$mark)}
          }
          if($proof -cnotcontains 'R408_PASS_OWNER_DIRECTORY_MOVE_DETECTED_FROM_LIVE_NATIVE_HANDLE' -and
             $proof -cnotcontains 'R408_PASS_OWNER_DIRECTORY_RENAME_REFUSED_DURING_PIN'){
            throw 'R408_HOSTED_NATIVE_DIRECTORY_MUTATION_PROOF_MISSING'
          }
          $proof
      - name: R407 compiled Broker file and ancestor launch lease
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R407-BrokerLaunchPinnedIdentity.ps1 -SupervisorPath ./build/_out/Supervisor/TaskbarMonitorSensorSupervisor.exe -SourceRoot . -HostedGuest)
          foreach($required in @(
            'R407_PASS_COMPILED_NATIVE_FILE_AND_ANCESTOR_HANDLES_ACQUIRED',
            'R407_PASS_TEN_NATIVE_BROKER_OUTPUT_AND_ANCESTOR_MUTATIONS_REFUSED',
            'R407_PASS_REAL_HOSTED_CREATEPROCESS_WHILE_BROKER_AND_ANCESTORS_PINNED',
            'R407_PASS_STORAGE_MISSING_LEAF_AND_CANONICAL_RECOVERY',
            'R407_PASS_INVALID_MODE_REJECTED_BEFORE_LAUNCH',
            'R407_PASS_HANDLE_DISPOSAL_RELEASES_FILES_AND_OUTSIDE_SHA_UNCHANGED',
            'R407_RESULT=PASS_COMPILED_ATOMIC_BROKER_LAUNCH_LEASE_SCOPE'
          )){
            if($proof -cnotcontains $required){throw ('R407_HOSTED_BROKER_LEASE_PROOF_MISSING_'+$required)}
          }
          $proof
      - name: R406 compiled Supervisor per-launch Broker mode and owner path validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R406-SupervisorLaunchRebind.ps1 -SupervisorPath ./build/_out/Supervisor/TaskbarMonitorSensorSupervisor.exe -SourceRoot . -HostedGuest)
          foreach($required in @(
            'R406_PASS_THREE_CANONICAL_MODES_AND_SPACES_REAL_COMPILED',
            'R406_PASS_THIRTEEN_UNTRUSTED_EXECUTABLE_MODE_OUTPUT_AND_PROFILE_CASES',
            'R406_PASS_RESTART_REJECTS_NEW_OWNER_OUTPUT_JUNCTION',
            'R406_PASS_RESTART_REJECTS_NEW_PROTECTED_BROKER_JUNCTION',
            'R406_PASS_CANONICAL_RECOVERS_AFTER_BOTH_JUNCTION_REMOVALS',
            'R406_PASS_OUTSIDE_CANARY_UNCHANGED_NO_REAL_BROKER_EXECUTED',
            'R406_RESULT=PASS_COMPILED_SUPERVISOR_LAUNCH_TIME_REBIND'
          )){
            if($proof -cnotcontains $required){throw ('R406_NATIVE_PER_LAUNCH_REBIND_PROOF_MISSING_'+$required)}
          }
          $proof
      - name: R405 compiled pinned verified Setup and Win32 file identity launch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R405-PinnedInstallerLaunch.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($required in @(
            'R405_PASS_BAD_SHA_REJECTED_WITHOUT_STALE_PINS',
            'R405_PASS_REAL_NET48_HANDLE_IDENTITY_AND_SHA',
            'R405_PASS_SEVEN_FILE_AND_ALL_OWNER_ANCESTOR_MUTATIONS_REJECTED',
            'R405_PASS_REAL_HOSTED_SHELLEXECUTE_WHILE_SAME_EXE_AND_ANCESTORS_PINNED',
            'R405_PASS_PINNED_SETUP_AND_OUTSIDE_CANARY_SHA256_UNCHANGED',
            'R405_PASS_PIN_RELEASE_ALLOWS_NORMAL_FILE_MANAGEMENT',
            'R405_RESULT=PASS_COMPILED_PINNED_FILE_AND_ANCESTOR_LAUNCH_BOUNDARY'
          )){
            if($proof -cnotcontains $required){throw ('R405_NATIVE_PIN_AND_SHELL_EXECUTION_PROOF_MISSING_'+$required)}
          }
          $proof
      - name: R404 compiled owner-only verified Setup execution scope
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R404-UpdaterLaunchCanonicalScope.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($required in @(
            'R404_PASS_REAL_OWNER_INSTALL_ROOT_POLICY_READONLY',
            'R404_PASS_COMPILED_CANONICAL_UPDATE_SETUP_AND_SHA256',
            'R404_PASS_TWELVE_MALICIOUS_OR_MISMATCHED_LAUNCH_PATHS_REJECTED',
            'R404_PASS_REAL_UPDATES_JUNCTION_REJECTED',
            'R404_PASS_SHA256_FIXTURES_UNCHANGED',
            'R404_PASS_NO_REAL_SETUP_PROCESS_LAUNCHED_OR_OWNER_CONFIGURATION_MODIFIED',
            'R404_RESULT=PASS_COMPILED_OWNER_ONLY_CANONICAL_SETUP_LAUNCH_GUARD'
          )){
            if($proof -cnotcontains $required){throw ('R404_REQUIRED_NATIVE_PROOF_MISSING_'+$required)}
          }
          $proof
      - name: R403 compiled canonical owner updater directory and version defenses
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R403-UpdaterCanonicalKnownFolder.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($mark in @(
            'R403_PASS_COMPILED_OFFICIAL_NUMERIC_SETUP_ASSET',
            'R403_PASS_MALFORMED_VERSIONS_AND_TRAVERSAL_REJECTED',
            'R403_PASS_OWNER_KNOWN_FOLDER_MATCHES_EXISTING_APP_READONLY',
            'R403_PASS_CANONICAL_OWNER_LOCAL_APPDATA_ACCEPTED',
            'R403_PASS_REDIRECT_UNC_RELATIVE_ROOT_ONLY_PATHS_REJECTED',
            'R403_PASS_COMPILED_UPDATES_PARENT_JUNCTION_REJECTED',
            'R403_PASS_OUTSIDE_CANARY_BYTE_IDENTICAL',
            'R403_PASS_NO_NETWORK_INSTALLER_OR_OWNER_MUTATION',
            'R403_RESULT=PASS_COMPILED_CANONICAL_OWNER_UPDATES_AND_NUMERIC_ASSET'
          )){
            if($proof -cnotcontains $mark){throw ('R403_COMPILED_UPDATER_NEGATIVE_PROOF_MISSING_'+$mark)}
          }
          $proof
      - name: R401 compiled post-fullscreen topmost loss policy (visible-only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R401-TopmostRecoveryPolicy.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($mark in @(
            'R401_PASS_MISSING_TOPMOST_REQUIRES_REPAIR_AFTER_VISIBLE',
            'R401_PASS_HEALTHY_TOPMOST_NO_PERPETUAL_RESTACK',
            'R401_PASS_FULLSCREEN_AND_HIDDEN_DO_NOT_RESTACK',
            'R401_PASS_START_SHELL_NOT_RESTACKED',
            'R401_PASS_SETTINGS_AND_MENU_NOT_RESTACKED',
            'R401_PASS_CHILD_MODE_NOT_RESTACKED',
            'R401_PASS_BOUNDARY_MATRIX_NO_UNCONDITIONAL_TOPMOST_TIMER',
            'R401_PASS_NO_REAL_TASKBAR_OR_OWNER_PROCESS_TOUCHED',
            'R401_RESULT=PASS_COMPILED_VISIBLE_TOPMOST_DRIFT_POLICY_ONLY'
          )){
            if($proof -cnotcontains $mark){throw ('R401_NATIVE_TOPMOST_DRIFT_PROOF_MISSING_'+$mark)}
          }
          $proof
      - name: R399 real compiled Explorer folder arguments remain one quoted path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R399-ExplorerFolderArgs.ps1 -AppPath ./build/_out/App/TaskbarMonitorEnhanced.exe -SourceRoot . -HostedGuest)
          foreach($mark in @(
            'R399_PASS_COMPILED_EXPLORER_ABSOLUTE_AND_QUOTED',
            'R399_PASS_NATIVE_DOTNET_ARGUMENT_SINGLE_PATH',
            'R399_PASS_RELATIVE_FOLDER_REJECTED',
            'R399_PASS_QUOTE_INJECTION_REJECTED',
            'R399_PASS_MISSING_FOLDER_REJECTED',
            'R399_PASS_THREE_UI_FOLDER_CALLS_PINNED',
            'R399_PASS_NO_REAL_EXPLORER_LAUNCHED',
            'R399_RESULT=PASS_SCOPED_EXPLORER_FOLDER_ARG_QUOTING'
          )){
            if($proof -cnotcontains $mark){throw ('R399_MISSING_NATIVE_EXPLORER_PROOF_'+$mark)}
          }
          $proof
      # R298: this compiles the actual PE-embedded cleanup source, then
      # invokes the pin/delete primitive ONLY on a freshly created Temp fixture.
      # It never invokes the owner uninstall or alters an installed product.
      - name: R298 native deferred-uninstall handle-bound cleanup contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R298-DeferredCleanupContract.ps1)
          $required=@(
            'R298_PASS_EMBEDDED_SOURCE_AND_FACTORY',
            'R298_PASS_TRUSTED_HOST_NO_CMD_NO_TEMP_SCRIPT',
            'R298_PASS_POWERSHELL_PARSE_AND_NATIVE_HANDLE_COMPILE',
            'R298_PASS_FAIL_CLOSED_ARGUMENTS',
            'R298_PASS_DISPOSABLE_EMPTY_DIRECTORY_PINNED_DELETE'
          )
          foreach($mark in $required){
            if($proof -notcontains $mark){throw ('R298 native contract missing proof: '+$mark)}
          }
          if($proof -notcontains 'R298_JUNCTION_REJECTED=PASS'){
            throw 'R298 junction adversarial fixture must run on hosted Windows'
          }

      - name: Verify deterministic clean-clone build
        shell: pwsh
        run: ./build/Verify-Determinism.ps1

      - name: Signed-staging separation regression (keep unsigned deterministic build pristine)
        shell: pwsh
        run: |
          ./build/Test-Signed-Staging.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Signed artifact staging separation gate failed.' }

      - name: G15 embedded signed Main payload contract (read-only installer verification)
        shell: pwsh
        run: |
          ./build/Test-Signed-Payload-Contract.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Setup failed to embed exact staged Main SHA256.' }

      - name: G15 OSS proprietary upstream exclusion negative test
        shell: pwsh
        run: |
          ./build/Test-NoPawnIO-OssRelease.ps1
          if ($LASTEXITCODE -ne 0) { throw 'A signed Setup may not embed the official PawnIO binary.' }

      - name: All-theme glass and chart visual acceptance (10 suites)
        shell: pwsh
        run: |
          ./build/Test-Workspace.ps1 -Executable ./build/_out/App/TaskbarMonitorEnhanced.exe -OutputDirectory ./artifacts/ci-visual -Visual
          if ($LASTEXITCODE -ne 0) { throw 'Visual regression suite failed.' }
          $v = Get-Content ./artifacts/ci-visual/SUMMARY.json -Raw | ConvertFrom-Json
          if ($v.Status -ne 'PASS' -or @($v.Results).Count -ne 10 -or @($v.Results | Where-Object Status -ne 'PASS').Count -ne 0) { throw 'Exactly ten visual and feature tests did not PASS.' }
          $chart = Get-Content ./artifacts/ci-visual/chartglassproof/CHART_GLASS_PROOF.json -Raw | ConvertFrom-Json
          if ($chart.Status -ne 'PASS' -or $chart.Themes -ne 49 -or $chart.Pairs -ne 196) { throw '49-theme 196-case chart foreground proof did not PASS.' }
          $glass = Get-Content ./artifacts/ci-visual/glassproof/GLASS_PROOF.json -Raw | ConvertFrom-Json
          if ($glass.Status -ne 'PASS' -or $glass.Tests -ne 196) { throw '49-theme alpha contrast foreground proof did not PASS.' }

      - name: R272 semantic thermal warnings visible as red ink in Glass on all 49 themes
        shell: pwsh
        run: |
          ./build/Test-GlassThermal-R272.ps1 -MainPath ./build/_out/App/TaskbarMonitorEnhanced.exe -OutDir ./artifacts/ci-thermal-r272
          $r = Get-Content ./artifacts/ci-thermal-r272/R272_ACCEPTANCE.json -Raw | ConvertFrom-Json
          if ($r.Status -cne 'PASS' -or $r.ThemePairs -ne 98 -or $r.AlertPixelMinimum -lt 40 -or $r.ColdPixelMaximum -ne 0) {
              throw 'R272 threshold-to-red foreground Glass semantic contract failed.'
          }
      - name: R244 nine-page Settings UI overlap and Glass mode renderer guard
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./build/Test-SettingsUi-R244.ps1 -MainPath ./build/_out/App/TaskbarMonitorEnhanced.exe -OutDir ./artifacts/ci-settings-r244
          $s = Get-Content ./artifacts/ci-settings-r244/R244_SETTINGS_UI.json -Raw | ConvertFrom-Json
          if($s.Status -cne 'PASS_ALL_NINE_SETTINGS_PAGES_NO_CONTROL_OVERLAP' -or
             $s.SettingsPages -ne 9 -or $s.SiblingOverlapCount -ne 0 -or
             $s.GlassStatusSeparate -ne $true -or $s.GlassTrackBackAlpha -ne 255) {
             throw 'R244.Settings UI glass switch overlap/layout regression'
          }

      - name: Portable runtime contract probes (5 suites; installed host checks separate)
        shell: pwsh
        run: |
          ./build/Test-Runtime.ps1 -Executable ./build/_out/App/TaskbarMonitorEnhanced.exe -OutputDirectory ./artifacts/ci-runtime -CiContract
          # Test-Runtime.ps1 uses Diagnostics.Process and validates child exit codes itself.
          # Its summary and thrown exceptions are authoritative, not a nullable LASTEXITCODE.
          $r = Get-Content ./artifacts/ci-runtime/SUMMARY.json -Raw | ConvertFrom-Json
          if ($r.Status -ne 'PASS' -or $r.Mode -ne 'CI_PORTABLE_5' -or @($r.Results).Count -ne 5 -or @($r.Results | Where-Object Status -ne 'PASS').Count -ne 0) { throw 'Five portable CI runtime probes did not PASS. Installed health and Start/Shell probes remain separate stable gates.' }

      - name: Generate SPDX 2.3 SBOM
        shell: pwsh
        run: ./build/Generate-Sbom.ps1

      - name: R136 release manifest and SBOM must match actual versioned setup bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./build/Verify-Release-Metadata-R273.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) {throw 'R136 release version, 5 output SHA and SBOM source gates FAILED'}

      - name: Attest binary build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'build/_out/**/*.exe'

      - name: Attest runtime config provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'build/_out/App/TaskbarMonitorEnhanced.exe.config'

      - name: Attest Setup SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'build/_out/Setup/TaskbarMonitorEnhanced_Setup_*.exe'
          sbom-path: 'artifacts/SBOM.spdx.json'

      - name: Upload verified build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-evidence
          if-no-files-found: error
          path: |
            build/_out/contracts/SUMMARY.json
            artifacts/DETERMINISM.json
            artifacts/ci-visual/SUMMARY.json
            artifacts/ci-visual/chartglassproof/CHART_GLASS_PROOF.json
            artifacts/ci-visual/glassproof/GLASS_PROOF.json
            artifacts/ci-thermal-r272/R272_ACCEPTANCE.json
            artifacts/ci-thermal-r272/real-thermal-pixels/THERMAL_GLASS_PROOF.json
            artifacts/ci-settings-r244/R244_SETTINGS_UI.json
            artifacts/ci-settings-r244/R244_GLASS_SWITCH_ON.png
            artifacts/ci-runtime/SUMMARY.json
            artifacts/BUILD_MANIFEST.json
            artifacts/SBOM.spdx.json
            build/_out/App/TaskbarMonitorEnhanced.exe
            build/_out/App/TaskbarMonitorEnhanced.exe.config
            build/_out/Broker/TaskbarMonitorSensorBroker.exe
            build/_out/Supervisor/TaskbarMonitorSensorSupervisor.exe
            build/_out/Setup/TaskbarMonitorEnhanced_Setup_*.exe

      - name: Print build manifest
        shell: pwsh
        run: Get-Content ./artifacts/BUILD_MANIFEST.json


  r298-disposable-original-cleanup:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fresh GitHub-hosted runner and absent owner installation preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced' -or
             $env:COMPUTERNAME -match '(?i)EMAD|ALIEMAD|LAPTOP|SAEID'){
            throw 'R298_HARD_REFUSE_NON_HOSTED_OR_OWNER'
          }
          $profile=[Environment]::GetFolderPath('UserProfile')
          $local=[Environment]::GetFolderPath('LocalApplicationData')
          $expected=Join-Path $profile 'AppData/Local'
          if(![string]::Equals([IO.Path]::GetFullPath($local),[IO.Path]::GetFullPath($expected),[StringComparison]::OrdinalIgnoreCase)){
            throw 'R298_HARD_REFUSE_NON_CANONICAL_PROFILE'
          }
          $app=Join-Path $local 'TaskbarMonitorEnhanced'
          if(Test-Path $app){throw 'R298_HARD_REFUSE_PREEXISTING_INSTALL_ROOT'}
          if(Test-Path (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'TaskbarMonitorEnhanced')){
            throw 'R298_HARD_REFUSE_PROTECTED_PRODUCT'
          }
          if(@(Get-Process TaskbarMonitorEnhanced,TaskbarMonitorSensorBroker,TaskbarMonitorSensorSupervisor -ErrorAction SilentlyContinue).Count){
            throw 'R298_HARD_REFUSE_EXISTING_PRODUCT_PROCESS'
          }
          if(Get-ScheduledTask -TaskName 'TaskbarMonitorEnhanced Sensor Broker' -ErrorAction SilentlyContinue){
            throw 'R298_HARD_REFUSE_EXISTING_SENSOR_TASK'
          }
          'R298_FRESH_HOSTED_NO_PRODUCT=PASS'

      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Download exact compiled build evidence from dependency job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-evidence
          path: .

      - name: Verify downloaded Setup digest against original build manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content ./artifacts/BUILD_MANIFEST.json -Raw|ConvertFrom-Json
          if($manifest.Version -cne '1.7.10'){throw 'R298_WRONG_VERSION'}
          $setupName='TaskbarMonitorEnhanced_Setup_1.7.10.exe'
          $f=Join-Path './build/_out/Setup' $setupName
          if(!(Test-Path $f)){throw 'R298_BUILD_ARTIFACT_MISSING'}
          $rows=@($manifest.Outputs|Where-Object Name -eq $setupName)
          if($rows.Count -ne 1 -or
             (Get-FileHash $f -Algorithm SHA256).Hash -cne $rows[0].SHA256 -or
             (Get-Item $f).Length -ne $rows[0].Bytes){
            throw 'R298_DOWNLOADED_SETUP_NOT_MANIFEST_PINNED'
          }
          'R298_EXACT_DEPENDENCY_BUILD_SHA=PASS'

      - name: R298 hosted original compiled Setup actual parent-wait and junction attack
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R298-HostedDeferredCleanup.ps1)
          $required=@(
            'R298_HOSTED_ORIGINAL_PE_PARENT_WAIT_AND_CLEANUP=PASS',
            'R298_HOSTED_ORIGINAL_PE_EXTERNAL_JUNCTION_REFUSED=PASS',
            'R298_HOSTED_FRESH_DISPOSABLE_ORIGINAL_DEFERRED_CLEANUP=PASS'
          )
          foreach($mark in $required){
            if($proof -notcontains $mark){throw ('R298_HOSTED_ACTUAL_UNINSTALL_GATE_MISSING_'+$mark)}
          }
          $proof


  # Only on freshly provisioned GitHub-hosted Windows without existing product.
  # The published 1.7.9 Setup is independently SHA-pinned before use.
  r299-public-v179-inplace-upgrade:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Assert clean disposable Windows guest before all fixture writes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced' -or
             $env:COMPUTERNAME -match '(?i)EMAD|ALIEMAD|LAPTOP|SAEID'){
            throw 'R299_REFUSE_OWNER_OR_NONHOSTED_RUNNER'
          }
          $local=[Environment]::GetFolderPath('LocalApplicationData')
          $profile=[Environment]::GetFolderPath('UserProfile')
          $expected=Join-Path $profile 'AppData/Local'
          if(![string]::Equals([IO.Path]::GetFullPath($local),
              [IO.Path]::GetFullPath($expected),[StringComparison]::OrdinalIgnoreCase)){
            throw 'R299_REFUSE_NONCANONICAL_GUEST_PROFILE'
          }
          $app=Join-Path $local 'TaskbarMonitorEnhanced'
          if((Test-Path $app) -or
             (Test-Path (Join-Path ([Environment]::GetFolderPath('ProgramFiles')) 'TaskbarMonitorEnhanced')) -or
             (Test-Path 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/TaskbarMonitorEnhanced') -or
             @(Get-Process TaskbarMonitorEnhanced,TaskbarMonitorSensorBroker,TaskbarMonitorSensorSupervisor -ErrorAction SilentlyContinue).Count -gt 0 -or
             (Get-ScheduledTask -TaskName 'TaskbarMonitorEnhanced Sensor Broker' -ErrorAction SilentlyContinue)){
            throw 'R299_REFUSE_PREEXISTING_PRODUCT_OR_DRIVER'
          }
          'R299_FRESH_DISPOSABLE_RUNNER=PASS'

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Download exact compiled candidate Setup and build manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-evidence
          path: .

      - name: Download SHA-pinned immutable public v1.7.9 Setup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $uri='https://github.com/GOD13emad/TaskbarMonitorEnhanced/releases/download/v1.7.9/TaskbarMonitorEnhanced_Setup_1.7.9.exe'
          $apiUri='https://api.github.com/repos/GOD13emad/TaskbarMonitorEnhanced/releases/assets/686770639'
          $path=Join-Path $env:RUNNER_TEMP 'R299_OFFICIAL_v1.7.9_SETUP.exe'
          if(Test-Path $path){throw 'R299_PUBLISHED_DOWNLOAD_PREEXISTS'}
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          # Prefer the immutable release asset API; retain the browser URL as a pinned fallback.
          $sources=@($apiUri,$uri)
          $delays=@(3,8,20)
          $downloaded=$false
          $downloadError=$null
          foreach($source in $sources){
            $isApi=$source.StartsWith('https://api.github.com/',[StringComparison]::OrdinalIgnoreCase)
            for($attempt=1;$attempt -le 4;$attempt++){
              try{
                if($isApi){
                  $headers=@{Accept='application/octet-stream';'X-GitHub-Api-Version'='2022-11-28'}
                  if(![string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)){$headers.Authorization='Bearer '+$env:GITHUB_TOKEN}
                  Invoke-WebRequest -UseBasicParsing -Uri $source -Headers $headers -MaximumRedirection 5 -OutFile $path -TimeoutSec 120 -ErrorAction Stop
                }else{
                  Invoke-WebRequest -UseBasicParsing -Uri $source -MaximumRedirection 5 -OutFile $path -TimeoutSec 120 -ErrorAction Stop
                }
                $downloaded=$true
                break
              }catch{
                $downloadError=$_.Exception
                Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
                $httpStatus=0
                if($_.Exception.Response -and $_.Exception.Response.StatusCode){$httpStatus=[int]$_.Exception.Response.StatusCode}
                $permanentHttpFailure=($httpStatus -ge 400 -and $httpStatus -lt 500 -and $httpStatus -ne 408 -and $httpStatus -ne 429)
                if($permanentHttpFailure -or $attempt -eq 4){break}
                $delay=$delays[$attempt-1]
                Write-Warning ('R299_RELEASE_DOWNLOAD_TRANSIENT_FAILURE source='+$(if($isApi){'API'}else{'BROWSER'})+' attempt='+$attempt+' status='+$httpStatus+' retrySeconds='+$delay)
                Start-Sleep -Seconds $delay
              }
            }
            if($downloaded){break}
          }
          if(!$downloaded){
            $detail=if($downloadError){$downloadError.Message}else{'unknown transport failure'}
            throw ('R299_PUBLIC_IMMUTABLE_RELEASE_DOWNLOAD_FAILED_AFTER_RETRIES '+$detail)
          }
          if((Get-Item -LiteralPath $path).Length -ne 8577536 -or
             (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -cne '3AE5E2AC7428C3443FF7768C543117AF864E7C73F68D32EFAD4AB40B30FB5B0E'){
            throw 'R299_PUBLIC_IMMUTABLE_RELEASE_DOWNLOAD_HASH_MISMATCH'
          }
          'R299_OFFICIAL_PUBLISHED_SETUP_SHA256=PASS'

      - name: Verify official 1.7.9 predecessor pins and five negative identities
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $published=Join-Path $env:RUNNER_TEMP 'R299_OFFICIAL_v1.7.9_SETUP.exe'
          $proof=@(& ./build/Test-R299-OfficialV179Pins.ps1 -PublishedSetup $published)
          foreach($mark in @(
            'R299_PUBLIC_OFFICIAL_179_SETUP_SHA=PASS',
            'R299_CANDIDATE_1710_VERSION_AND_IDENTITY=PASS',
            'R299_IMMUTABLE_PUBLIC_RESOURCE_MATCH=PASS_21_OF_21',
            'R299_PREDECESSOR_MANAGED_FILE_PINS=PASS_22_OF_22',
            'R299_IN_MEMORY_UPDATE_PRESERVES_UNRELATED_FIELDS=PASS',
            'R299_FOREIGN_OR_MISMATCHED_PREDECESSOR_REJECTED=PASS_5_OF_5'
          )){
            if($proof -notcontains $mark){throw ('R299_PIN_CONTRACT_MISSING_'+$mark)}
          }
          $proof

      - name: Real original compiled Setup upgrade synthetic public 1.7.9 install
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $published=Join-Path $env:RUNNER_TEMP 'R299_OFFICIAL_v1.7.9_SETUP.exe'
          $proof=@(& ./build/Test-R299-HostedPublicV179Upgrade.ps1 -OfficialSetup $published)
          foreach($mark in @(
            'R299_HOSTED_TOKEN_PROCESS_CREATION=PASS',
            'R299_HOSTED_CRASH_CHILD_GUI_HOST=PASS',
            'R299_HOSTED_CRASH_GUI_BOOTSTRAP=PASS',
            'R299_HOSTED_CRASH_CHILD_ENTRY=PASS',
            'R299_HOSTED_CRASH_CHILD_STARTUP=PASS',
            'R299_HOSTED_TAMPERED_OFFICIAL_PREDECESSOR_REFUSED_BEFORE_MUTATION=PASS',
            'R299_HOSTED_ABRUPT_TWO_FILE_COMMITTING_RECOVERED_BY_REAL_SETUP=PASS',
            'R299_HOSTED_ORIGINAL_SETUP_OFFICIAL_179_TO_1710_INPLACE_UPGRADE=PASS',
            'R299_HOSTED_CONFIG_SENSOR_REGISTRY_AND_OUTSIDE_CANARIES_PRESERVED=PASS',
            'R299_HOSTED_EXACT_SECOND_UPDATE_IDEMPOTENT=PASS',
            'R299_HOSTED_PUBLIC_V179_UPGRADE_RECEIPT=PASS'
          )){
            if($proof -notcontains $mark){throw ('R299_ORIGINAL_SETUP_UPGRADE_MISSING_'+$mark)}
          }
          $receipt=Join-Path $env:RUNNER_TEMP 'R299_PUBLIC179_HOSTED_UPGRADE_RECEIPT.json'
          if(!(Test-Path $receipt)){throw 'R299_ACCEPTANCE_RECEIPT_MISSING'}
          New-Item -ItemType Directory -Path './artifacts' -Force|Out-Null
          Copy-Item -LiteralPath $receipt -Destination './artifacts/R299_PUBLIC179_HOSTED_UPGRADE_RECEIPT.json' -ErrorAction Stop
          $proof

      - name: Upload R299 hosted Setup failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r299-public-v179-failure-diagnostics
          path: ${{ runner.temp }}/TBME_R126_STABLE_UPDATE/R129_DIAG_*.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload original-PE official 1.7.9 upgrade receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r299-public-v179-upgrade-receipt
          if-no-files-found: error
          path: artifacts/R299_PUBLIC179_HOSTED_UPGRADE_RECEIPT.json

  # R300: actual compiled 1.7.10 fresh install on fresh GitHub-hosted Windows.
  r300-disposable-fresh-install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Assert fresh disposable Windows VM prior to installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'GOD13emad/TaskbarMonitorEnhanced' -or
             $env:COMPUTERNAME -match '(?i)EMAD|ALIEMAD|LAPTOP|SAEID'){
             throw 'R300_NOT_DISPOSABLE_GITHUB_HOSTED_WINDOWS'
          }
          $app=Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'TaskbarMonitorEnhanced'
          if((Test-Path $app) -or
             (Test-Path 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Uninstall/TaskbarMonitorEnhanced') -or
             @(Get-Process TaskbarMonitorEnhanced -ErrorAction SilentlyContinue).Count){
             throw 'R300_GUEST_ALREADY_HAS_PRODUCT'
          }
          'R300_PRE_INSTALL_GUEST_EMPTY=PASS'

      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Consume manifest-pinned Setup built by dependency
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: build-evidence
          path: .

      - name: Real compiled Setup fresh install on disposable clean user profile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $proof=@(& ./build/Test-R300-HostedFreshInstall.ps1)
          foreach($mark in @(
            'R300_HOSTED_SETUP_RESOURCE_VERIFY=PASS',
            'R300_HOSTED_REAL_FRESH_INSTALL_AND_EXACT_BINARY_HASHES=PASS',
            'R300_HOSTED_ONE_ROOT_START_MENU_REGISTRY_AND_STARTUP_FALSE=PASS',
            'R300_HOSTED_REAL_INSTALL_SENSOR_STATE_AND_EXTERNAL_CANARY=PASS',
            'R300_HOSTED_FRESH_INSTALL_RECEIPT=PASS'
          )){
            if($proof -notcontains $mark){throw ('R300_REAL_FRESH_INSTALL_PROOF_MISSING_'+$mark)}
